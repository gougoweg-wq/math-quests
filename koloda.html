<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Колода X</title>
<style>

<script>
/*CORE*/
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const NAMES=['Ноа','Ари','Дани','Рони','Тали','Лиа'];
const two=()=>{const a=pick(NAMES);let b=pick(NAMES);while(b===a)b=pick(NAMES);return[a,b]};
const raz=k=>k<=4?'раза':'раз';
const pl=(n,a,b,c)=>{const m=n%100,d=n%10;return n+' '+(m>10&&m<20?c:d===1?a:d>=2&&d<=4?b:c)};
const dec=n=>String(n).replace('.',',');
const CASES={
sum3(){const n=R(11,40),S=3*n+3;return{kind:'Числа подряд',text:`Три числа идут подряд, их сумма равна ${S}.`,letX:'первое число',root:n,frame:'▢ + ▢ + ▢ = ▢',phr:[['первое число','x'],['следующее за ним','x + 1'],['третье число','x + 2'],['их сумма',''+S]],traps:['2x','x + 3','3x','x − 1']}},
more(){const[A,B]=two(),a=R(12,40),d=R(3,15),S=2*a+d;return{kind:'На больше',text:`У ${A} и ${B} вместе ${pl(S,'монета','монеты','монет')}. У ${B} на ${pl(d,'монету','монеты','монет')} больше, чем у ${A}.`,letX:`монеты ${A}`,root:a,frame:'▢ + ▢ = ▢',phr:[[`монеты ${A}`,'x'],[`у ${B} на ${d} больше`,`x + ${d}`],['вместе',''+S]],traps:[`${d}x`,`x − ${d}`,`${S} + x`,`${d}`]}},
times(){const[A,B]=two(),a=R(6,20),k=R(3,6),S=a*(k+1);return{kind:'Во сколько раз',text:`У ${A} и ${B} вместе ${pl(S,'наклейка','наклейки','наклеек')}. У ${A} в ${k} ${raz(k)} больше, чем у ${B}.`,letX:`наклейки ${B}`,root:a,frame:'▢ + ▢ = ▢',phr:[[`наклейки ${B}`,'x'],[`у ${A} в ${k} ${raz(k)} больше`,`${k}x`],['вместе',''+S]],traps:[`x + ${k}`,`x/${k}`,`${S}x`,`${k}`]}},
rect(){const w=R(4,20),d=R(2,9),P=2*(2*w+d);return{kind:'Периметр',text:`Длина прямоугольника на ${d} см больше ширины. Периметр равен ${P} см.`,letX:'ширина',root:w,frame:'2(▢ + ▢) = ▢',phr:[['ширина','x'],[`длина на ${d} больше`,`x + ${d}`],['периметр',''+P]],traps:[`${d}x`,`x − ${d}`,`2x`,`${P}x`]}},
price(){const p=pick([10,20,25,50]),o=20*R(5,30),P=o*(100+p)/100,q=dec(p/100);return{kind:'Проценты: рост',text:`Кроссовки подорожали на ${p}% и теперь стоят ${P} ₪.`,letX:'старая цена',root:o,frame:'▢ + ▢ = ▢',phr:[['старая цена','x'],[`прибавка ${p}%`,`${q}x`],['новая цена',''+P]],traps:[`${p}x`,`x + ${p}`,`x/${p}`,`${q}`]}},
sale(){const p=pick([10,20,25,50]),o=20*R(5,30),P=o*(100-p)/100,q=dec(p/100);return{kind:'Проценты: скидка',text:`На куртку скидка ${p}%. Со скидкой она стоит ${P} ₪.`,letX:'цена без скидки',root:o,frame:'▢ − ▢ = ▢',phr:[['цена без скидки','x'],[`скидка ${p}%`,`${q}x`],['цена со скидкой',''+P]],traps:[`${p}x`,`x − ${p}`,`x/${p}`,`${q}`]}},
give(){const[A,B]=two(),g=R(6,25);return{kind:'Было и стало',text:`У ${A} в 3 раза больше карточек, чем у ${B}. Если ${A} передаст ${B} ${pl(g,'карточку','карточки','карточек')}, у них станет поровну.`,letX:`карточки ${B} сейчас`,root:g,frame:'▢ = ▢',phr:[[`у ${A} станет`,`3x − ${g}`],[`у ${B} станет`,`x + ${g}`]],traps:[`3x + ${g}`,`x − ${g}`,`3(x − ${g})`,`${g}x`]}},
speed(){const a=R(2,3),b=R(2,4),v=R(30,70),d=10*R(1,2),S=a*v+b*(v+d);return{kind:'Движение',text:`Поезд ехал ${a} ч с одной скоростью, потом ${b} ч на ${d} км/ч быстрее. Всего он проехал ${S} км.`,letX:'скорость сначала',root:v,frame:'▢ + ▢ = ▢',phr:[['путь сначала',`${a}x`],['путь потом',`${b}(x + ${d})`],['весь путь',''+S]],traps:[`${b}x + ${d}`,`x + ${a}`,`${a}(x + ${d})`,`${b}(x − ${d})`]}},
age(){const b=R(7,12),t=R(3,8),a=3*b+2*t;return{kind:'Возраст',text:`Папе ${pl(a,'год','года','лет')}, сыну ${b}. Через сколько лет папа будет старше сына ровно в 3 раза?`,letX:'сколько лет пройдёт',root:t,frame:'▢ = 3(▢)',phr:[['папа через x лет',`${a} + x`],['сын через x лет',`${b} + x`]],traps:[`${a}x`,`${b}x`,`${a} − x`,`${b} − x`]}},
book(){const m=R(2,12),N=7*m;return{kind:'Дроби',text:`В первый день прочитали треть книги, во второй — четверть. Всего прочитано ${pl(N,'страница','страницы','страниц')}.`,letX:'страницы всей книги',root:12*m,frame:'▢ + ▢ = ▢',phr:[['треть книги','x/3'],['четверть книги','x/4'],['прочитано',''+N]],traps:['3x','4x','x − 3','x + 4']}},
money(){const m=R(12,30),s=R(5,15),r=2*m-s;return{kind:'Было и осталось',text:`Тали потратила треть денег на книгу и ещё ${s} ₪ на сок. Осталось ${r} ₪.`,letX:'деньги сначала',root:3*m,frame:'▢ − ▢ − ▢ = ▢',phr:[['деньги сначала','x'],['на книгу','x/3'],['на сок',''+s],['осталось',''+r]],traps:['3x',`${s}x`,`x + ${s}`,'x − 3']}},
tickets(){const a=R(2,5),b=R(2,4),d=5*R(1,3),p=5*R(6,14),T=a*p+b*(p-d);return{kind:'Покупка',text:`Купили ${a} взрослых и ${b} детских билетов на ${T} ₪. Детский на ${d} ₪ дешевле взрослого.`,letX:'цена взрослого билета',root:p,frame:'▢ + ▢ = ▢',phr:[['взрослые билеты',`${a}x`],['детские билеты',`${b}(x − ${d})`],['вся покупка',''+T]],traps:[`${b}x − ${d}`,`${b}(x + ${d})`,`${a}(x − ${d})`,`${b}x`]}}
};
const FRAMES={2:['▢ = ▢','▢ + ▢ = 0','▢ = 2(▢)','▢ = 3(▢)','3(▢) = ▢'],3:['▢ + ▢ = ▢','▢ − ▢ = ▢','▢ = ▢ + ▢','▢ · ▢ = ▢','2(▢ + ▢) = ▢'],4:['▢ + ▢ + ▢ = ▢','▢ − ▢ − ▢ = ▢','▢ + ▢ − ▢ = ▢','▢ − ▢ + ▢ = ▢']};
const slots=f=>(f.match(/▢/g)||[]).length;
const fill=(f,ts)=>{let i=0;return f.replace(/▢/g,()=>{const t=ts[i++];return t==null?'▢':t})};
function compile(s){s=s.replace(/−/g,'-').replace(/·/g,'*').replace(/,/g,'.').replace(/\s/g,'');let i=0;
 const expr=()=>{let f=term();while(s[i]==='+'||s[i]==='-'){const o=s[i++],a=f,b=term();f=o==='+'?x=>a(x)+b(x):x=>a(x)-b(x)}return f};
 const term=()=>{let f=fac();for(;;){const c=s[i];if(c==='*'||c==='/'){i++;const a=f,b=fac();f=c==='*'?x=>a(x)*b(x):x=>a(x)/b(x)}else if(c==='x'||c==='('){const a=f,b=fac();f=x=>a(x)*b(x)}else return f}};
 const fac=()=>{if(s[i]==='x'){i++;return x=>x}if(s[i]==='('){i++;const f=expr();i++;return f}const m=s.slice(i).match(/^\d+(\.\d+)?/);i+=m[0].length;const v=+m[0];return()=>v};
 return expr()}
const sides=eq=>eq.split('=').map(compile);
const rootOf=eq=>{const[L,Rr]=sides(eq),d=x=>L(x)-Rr(x),y0=d(1),y1=d(2),y2=d(3);if(Math.abs(y2-2*y1+y0)>1e-9)return NaN;const a=y1-y0;return Math.abs(a)<1e-9?NaN:-(y0-a)/a};
/*END*/
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const FOES=[['🟢','Слизь Плюс',2,['sum3','more','times']],['🦇','Минусовая мышь',2,['more','times','rect']],['🧟','Процентный зомби',3,['price','sale','rect']],['🕷️','Паук Равенства',3,['give','sale','price']],['🐉','Дробный дракон',4,['book','money','speed','tickets']],['👑','Король Икс',5,['age','speed','tickets','money']]];
const SK={scan:{n:'Скан',d:'сжигает ловушки в руке',c:1},guard:{n:'Щит',d:'блок +4',c:1},bolt:{n:'Заряд',d:'+2 энергии',c:0},tip:{n:'Подсказка',d:'показывает верный ход',c:1}};
const LOOT=[{k:'scan',n:'Карта «Скан»',d:'Сжигает все ловушки в руке.'},{k:'bolt',n:'Карта «Заряд»',d:'+2 энергии, бесплатно.'},{k:'tip',n:'Карта «Подсказка»',d:'Показывает верную пару.'},{k:'guard',n:'Карта «Щит»',d:'Блок +4.'},{r:'armor',n:'Реликвия: Броня',d:'Каждый ход +2 блока.'},{r:'batt',n:'Реликвия: Батарея',d:'Каждый ход +1 энергия.'},{r:'lens',n:'Реликвия: Линза',d:'В начале боя сгорает одна ловушка.'},{h:6,n:'Зелье',d:'Вернуть 6 здоровья.'}];
let muted=true,ac=null,hp,maxHp=16,deck,relics,floor,log=[],F=null;
function tone(f,d,t=0){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(.1,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
function newRun(){hp=maxHp;deck=['scan','guard','guard'];relics=[];floor=0;log=[];startFight()}
function startFight(){const[face,name,atk,pool]=FOES[floor];const c=CASES[pick(pool)]();const ts=c.phr.map(p=>p[1]);const fr=shuffle(FRAMES[slots(c.frame)].filter(f=>f!==c.frame&&!(Math.abs(rootOf(fill(f,ts))-c.root)<1e-6))).slice(0,2);
 const tiles=[...c.phr.map((p,i)=>({t:p[1],slot:i})),...c.traps.filter(t=>!c.phr.some(p=>p[1]===t)).map(t=>({t,trap:true})),{t:c.frame,frame:true},...fr.map(t=>({t,frame:true,trap:true}))];
 tiles.forEach((t,i)=>t.id=i);F={face,name,atk,c,pool:tiles,hand:[],skills:[],sel:null,placed:c.phr.map(()=>null),frame:null,en:0,block:0,msg:'',mc:'',tip:null,wrong:[],hits:0,done:false};
 if(relics.includes('lens')){const a=F.pool.filter(t=>t.trap&&!t.frame);if(a.length)F.pool=F.pool.filter(t=>t!==pick(a))}
 turn()}
function left(){return F.pool.filter(t=>!t.trap&&!t.used)}
function turn(){F.en=3+(relics.includes('batt')?1:0);F.block=relics.includes('armor')?2:0;F.sel=null;F.tip=null;const free=F.pool.filter(t=>!t.used);const good=shuffle(free.filter(t=>!t.trap)),bad=shuffle(free.filter(t=>t.trap));const g=good.slice(0,3);F.hand=shuffle([...g,...bad.slice(0,5-g.length)]);F.skills=shuffle(deck).slice(0,2).map(k=>({k}));render()}
function say(m,c){F.msg=m;F.mc=c}
function hitMe(n,why){const a=Math.min(F.block,n);F.block-=a;const d=n-a;hp-=d;F.hits+=d;tone(160,.25);return d}
function play(card,sh){if(F.en<1)return;F.en--;const ok=sh==='frame'?(card.frame&&!card.trap):(!card.frame&&!card.trap&&card.t===F.c.phr[sh][1]);
 if(ok){card.used=true;F.hand=F.hand.filter(x=>x!==card);if(sh==='frame')F.frame=card.t;else F.placed[sh]=card.t;F.sel=null;F.tip=null;say('Попал! Щит пробит.','ok');tone(660,.1);tone(880,.12,.08);bump('hit')}
 else{const lab=sh==='frame'?'как всё связать':F.c.phr[sh][0];F.wrong.push(lab+' ≠ '+card.t);F.hand=F.hand.filter(x=>x!==card);if(card.trap)card.used=true;F.sel=null;const d=hitMe(1);say(`Не то: «${lab}» — это не ${card.t}. Контрудар −${d}.`,'bad');bump('strike')}
 if(hp<=0)return lose();if(F.frame&&F.placed.every(Boolean))return finisher();render();if(F.en<1&&!F.skills.some(s=>SK[s.k].c===0))F.timer=setTimeout(endTurn,1400)}
function bump(c){const e=document.querySelector('.foe');if(!e)return;e.classList.add(c);setTimeout(()=>e.classList.remove(c),200)}
function endTurn(){clearTimeout(F.timer);if(!F||F.done||document.querySelector('.scale'))return;const d=hitMe(F.atk);say(d?`${F.name} бьёт: −${d}.`:'Блок выдержал удар!',d?'bad':'ok');if(hp<=0)return lose();turn();bump('strike')}
function useSkill(s){const S=SK[s.k];if(F.en<S.c)return;F.en-=S.c;F.skills=F.skills.filter(x=>x!==s);
 if(s.k==='guard'){F.block+=4;say('Блок +4.','ok')}
 if(s.k==='bolt'){F.en+=2;say('Энергия +2.','ok')}
 if(s.k==='scan'){const t=F.hand.filter(c=>c.trap);t.forEach(c=>c.used=true);F.hand=F.hand.filter(c=>!c.trap);say(`Сгорело ловушек: ${t.length}.`,'ok')}
 if(s.k==='tip'){const c=F.hand.find(c=>!c.trap);if(c){F.tip={id:c.id,sh:c.frame?'frame':F.c.phr.findIndex((p,i)=>p[1]===c.t&&!F.placed[i])};say('Подсвечена верная пара.','ok')}}
 tone(520,.1);render()}
function header(a){const t=el('div','top');t.append(el('div','pill','❤️ '+Math.max(0,hp)+'/'+maxHp),el('div','pill','⚡ '+F.en),el('div','pill','🛡️ '+F.block),el('div','pill','Этаж '+(floor+1)+'/'+FOES.length));if(relics.length)t.append(el('div','pill',relics.map(r=>({armor:'🦺',batt:'🔋',lens:'🔎'}[r])).join('')));t.append(el('div','sp'));const m=el('button','ib',muted?'🔇':'🔊');m.type='button';m.setAttribute('aria-label',muted?'Включить звук':'Выключить звук');m.onclick=()=>{muted=!muted;render()};t.append(m);a.append(t);
 const left=F.c.phr.filter((_,i)=>!F.placed[i]).length+(F.frame?0:1);const f=el('div','foe');f.append(el('div','face',F.face));const w=el('div');w.append(el('h2',null,F.name),el('div','sub',left?'Щитов осталось: '+left:'Щиты пробиты!'));f.append(w,el('div','intent','⚔️ '+F.atk));a.append(f)}
