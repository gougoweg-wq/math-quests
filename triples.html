<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Triple Match</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1024;color:#eef2ff;font:700 18px/1.3 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;user-select:none;display:flex;flex-direction:column;align-items:center}
header{width:100%;max-width:820px;display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
h1{font-size:22px;margin:0;color:#ffd166}.stat{font-size:16px;color:#a9b4ff}
#hint{max-width:820px;padding:0 16px 10px;color:#c7cdf5;font-weight:500;text-align:center}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px;width:100%;max-width:820px;padding:8px 16px 24px}
.card{height:96px;border-radius:16px;background:#1b2150;border:3px solid #2b3474;display:flex;align-items:center;justify-content:center;font-size:30px;cursor:pointer;transition:transform .12s,background .2s,border-color .2s}
.card:hover{transform:translateY(-3px)}.card.sel{border-color:#ffd166;background:#2d3577;transform:scale(1.05)}
.card.f{color:#7dd3fc}.card.d{color:#fca5a5}.card.p{color:#86efac}
.card.gone{animation:pop .5s forwards;pointer-events:none}@keyframes pop{40%{transform:scale(1.25);background:#ffd166}100%{transform:scale(0);opacity:0}}
.card.bad{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1}.frac b{border-top:3px solid currentColor;padding-top:2px}
#box{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center}#box div{background:#1b2150;border:3px solid #ffd166;border-radius:20px;padding:28px 34px;text-align:center;max-width:90vw}
#box h2{margin:0 0 8px;color:#ffd166;font-size:30px}#box p{font-weight:500}button{font:700 20px system-ui;background:#ffd166;color:#1b1b1b;border:0;border-radius:12px;padding:12px 26px;cursor:pointer;margin-top:10px}
#combo{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);font-size:44px;color:#ffd166;pointer-events:none;opacity:0;text-shadow:0 0 20px #ffb703}#combo.on{animation:cb .8s}@keyframes cb{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}100%{opacity:0;transform:translate(-50%,-110%) scale(1.3)}}
</style></head><body>
<header><h1>Triple Match</h1><span class="stat" id="lv"></span><span class="stat" id="sc"></span></header>
<div id="hint">Find 3 cards with the same value: a <span style="color:#7dd3fc">fraction</span>, a <span style="color:#fca5a5">decimal</span> and a <span style="color:#86efac">percentage</span>.</div>
<div id="grid"></div><div id="combo"></div>
<div id="box"><div><h2 id="bt"></h2><p id="bp"></p><button id="bb">GO</button></div></div>
<script>
const L1=[['1','2','0.5','50%'],['1','4','0.25','25%'],['3','4','0.75','75%'],['1','10','0.1','10%']];
const L2=[['1','5','0.2','20%'],['2','5','0.4','40%'],['3','10','0.3','30%'],['7','10','0.7','70%'],['4','5','0.8','80%']];
const L3=[['1','8','0.125','12.5%'],['3','8','0.375','37.5%'],['3','20','0.15','15%'],['1','20','0.05','5%'],['9','10','0.9','90%'],['1','25','0.04','4%']];
const L4=[['6','8','0.75','75%'],['18','24','0.75','75%'],['12','40','0.3','30%'],['9','12','0.75','75%'],['14','20','0.7','70%'],['2','8','0.25','25%']];
const LEVELS=[{n:'Warm-up',t:L1},{n:'Fifths & tenths',t:L2},{n:'Tricky ones',t:L3},{n:'Boss: not simplified!',t:L4.filter((x,i)=>i!==3&&i!==1)}];
let intro=true,lv=0,score=0,miss=0,sel=[],left=0,streak=0;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){const T=LEVELS[lv].t;const cards=[];T.forEach((t,i)=>{const v=parseFloat(t[2]);cards.push({k:'f',v,h:`<span class="frac">${t[0]}<b>${t[1]}</b></span>`},{k:'d',v,h:t[2]},{k:'p',v,h:t[3]})});
left=T.length;miss=0;sel=[];$('grid').innerHTML='';shuffle(cards).forEach(c=>{const e=document.createElement('div');e.className='card '+c.k;e.innerHTML=c.h;e.dataset.v=c.v;e.dataset.k=c.k;e.onclick=()=>tap(e);$('grid').appendChild(e)});upd()}
function upd(){$('lv').textContent=`Level ${lv+1}/${LEVELS.length}: ${LEVELS[lv].n}`;$('sc').textContent=`Score ${score}`}
function tap(e){if(e.classList.contains('sel')){e.classList.remove('sel');sel=sel.filter(x=>x!==e);return}
if(sel.some(x=>x.dataset.k===e.dataset.k)){const o=sel.find(x=>x.dataset.k===e.dataset.k);o.classList.remove('sel');sel=sel.filter(x=>x!==o)}
e.classList.add('sel');sel.push(e);if(sel.length<3)return;
const ok=sel.every(x=>Math.abs(x.dataset.v-sel[0].dataset.v)<1e-9);const s=sel;sel=[];
if(ok){streak++;score+=10*streak;s.forEach(x=>{x.classList.remove('sel');x.classList.add('gone')});
left--;if(streak>1){const c=$('combo');c.textContent=`COMBO x${streak}!`;c.classList.remove('on');void c.offsetWidth;c.classList.add('on')}
upd();if(left===0)setTimeout(win,600)}
else{streak=0;miss++;score=Math.max(0,score-3);s.forEach(x=>{x.classList.remove('sel');x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),400)});upd()}}
function win(){const st=miss===0?3:miss<=2?2:1;$('bt').textContent='★'.repeat(st)+'☆'.repeat(3-st);
$('bp').textContent=lv+1<LEVELS.length?`Level ${lv+1} cleared with ${miss} mistake${miss===1?'':'s'}.`:`All levels done! Final score: ${score}`;
$('bb').textContent=lv+1<LEVELS.length?'NEXT LEVEL':'PLAY AGAIN';$('box').style.display='flex'}
$('bb').onclick=()=>{$('box').style.display='none';if(intro){intro=false;start();return}if(lv+1<LEVELS.length)lv++;else{lv=0;score=0}start()};
$('bt').textContent='Triple Match';$('bp').textContent='Tap a fraction, a decimal and a percentage that are equal. Wrong triple = −3 points. Matches in a row = combo!';$('box').style.display='flex';
</script></body></html>
