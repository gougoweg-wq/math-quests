<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraction Laser</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:#04050f;color:#e8f3ff;font:700 18px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;overflow:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#planet{position:fixed;left:-90px;bottom:-110px;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle at 68% 30%,#ffb26b 0,#e0572f 28%,#6d1c52 60%,#1c0a33 82%);box-shadow:0 0 70px #ff7b4a60,inset -30px -30px 70px #0009;z-index:0}#planet:after{content:"";position:absolute;left:-26%;top:42%;width:152%;height:18%;border:5px solid #ffd7a855;border-radius:50%;transform:rotate(-16deg)}
.ship{position:fixed;right:7%;top:9%;width:clamp(190px,22vw,290px);z-index:1;animation:hov 3.4s ease-in-out infinite}.ship.in{animation:arr .8s cubic-bezier(.2,1.2,.4,1),hov 3.4s ease-in-out .8s infinite}.ship.dead{animation:die .55s forwards}@keyframes hov{50%{translate:0 -12px}}@keyframes arr{from{transform:translate(110%,-60%) scale(.5)}}@keyframes die{30%{filter:brightness(4)}100%{transform:scale(1.25) rotate(14deg);opacity:0;filter:brightness(3)}}.hp{position:absolute;left:12%;right:12%;top:-14px;height:8px;background:#301030;border-radius:5px;overflow:hidden}.hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3d6e,#ffb02e);transition:width .3s}
.shot{position:fixed;height:10px;border-radius:9px;background:linear-gradient(90deg,#fff,#7df9ff 40%,#2c8bff);box-shadow:0 0 22px 7px #5cc8ff;transform-origin:0 50%;z-index:4;animation:sh .42s forwards}@keyframes sh{from{opacity:1;scale:0 1}35%{opacity:1;scale:1 1}to{opacity:0;scale:1 .1}}
.kills{font:800 15px ui-monospace,Menlo,Consolas,monospace;color:#ffd166}
.w{position:relative;z-index:2;max-width:980px;margin:0 auto;height:100%;padding:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}.lv{font:800 15px ui-monospace,Menlo,Consolas,monospace;color:#7df9ff;letter-spacing:.06em}
.task{align-self:flex-start;font:900 clamp(40px,7vw,68px)/1 ui-monospace,Menlo,Consolas,monospace;color:#fff;text-shadow:0 0 22px #7df9ff,0 3px 0 #1a4a8a}.task small{display:block;font:700 16px system-ui,sans-serif;color:#9fb3c8;margin-top:6px}
.say{margin-top:clamp(20px,6vh,60px);font-size:clamp(19px,2.6vw,24px);font-weight:800;color:#ffd166;text-align:center;min-height:32px;text-shadow:0 2px 8px #000}
.bar{position:relative;width:100%;height:clamp(104px,18vh,136px);display:flex;gap:5px;padding:10px 14px;border-radius:18px;background:linear-gradient(180deg,#7c8aa8 0,#2b3350 12%,#141a33 50%,#2b3350 88%,#58658a 100%);box-shadow:0 0 0 3px #0b0f22,0 0 0 5px #5c6c96,0 12px 30px #000a,0 0 44px #2c6bff60}.bar:before,.bar:after{content:"";position:absolute;top:18%;bottom:18%;width:14px;background:linear-gradient(180deg,#c9d4ec,#55607f);border-radius:4px}.bar:before{left:-19px}.bar:after{right:-19px}
.seg{position:relative;overflow:hidden;flex:1;min-width:0;border:0;border-radius:10px;background:linear-gradient(180deg,#0f1738,#1a2a60);box-shadow:inset 0 2px 8px #000c,inset 0 0 0 1px #5c7ad055;color:#cfe3ff;font:900 clamp(18px,3vw,28px) ui-monospace,Menlo,Consolas,monospace;cursor:default;transition:background .15s,box-shadow .15s,transform .15s}
.seg.can{cursor:pointer}.seg.can:hover{transform:translateY(-3px)}.seg.on{background:linear-gradient(180deg,#d8fff8 0,#7df9e0 22%,#16c7ba 70%,#0a8f9a);color:#02242c;box-shadow:0 0 26px #5cf2e0,inset 0 0 18px #fff8}.seg.on:after{content:"";position:absolute;left:-30%;right:-30%;top:14%;height:9px;background:#ffffffa0;border-radius:50%;animation:wv 1.6s ease-in-out infinite}@keyframes wv{50%{transform:translateX(12%) translateY(5px)}}
.whole{flex:1;display:grid;place-items:center;font:900 clamp(34px,5vw,50px) ui-monospace,Menlo,Consolas,monospace;border-radius:10px;background:linear-gradient(90deg,#123a9c,#29c6ff,#7df9ff,#29c6ff,#123a9c);background-size:200% 100%;animation:fl 2.6s linear infinite;text-shadow:0 0 14px #fff,0 2px 0 #123a9c;box-shadow:0 0 24px #29c6ff}@keyframes fl{to{background-position:-200% 0}}
.beam{position:absolute;top:-34px;bottom:-34px;width:5px;background:#fff;box-shadow:0 0 18px 7px #ff3d9a;animation:zap .45s forwards}@keyframes zap{from{opacity:1;transform:scaleY(.2)}60%{opacity:1;transform:scaleY(1)}to{opacity:0}}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.o{font:900 clamp(22px,3.4vw,30px) ui-monospace,Menlo,Consolas,monospace;min-width:82px;min-height:66px;padding:0 20px;color:#fff;background:linear-gradient(180deg,#26357c,#121a48);border:0;clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%);cursor:pointer;transition:transform .1s,filter .1s}.o:hover{filter:brightness(1.5);transform:scale(1.06)}.o.no{opacity:.3}.o.add{border-color:#ffd166;color:#ffd166}
.calc{font:800 clamp(20px,3vw,26px) ui-monospace,Menlo,Consolas,monospace;color:#a5fff0;min-height:34px;text-align:center}
.ib{background:#10162c;color:#fff;border:1px solid #2a3560;border-radius:9px;min-width:42px;min-height:38px;cursor:pointer}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:#03040ccc;z-index:5;padding:16px;text-align:center}.box{max-width:540px;background:#0c1228;border-top:3px solid #7df9ff;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:11px;align-items:center}.box h1{margin:0;font-size:32px;color:#7df9ff}.box p{margin:0}.btn{font:800 18px system-ui,sans-serif;background:#7df9ff;color:#04202a;border:0;border-radius:9px;min-height:50px;padding:0 28px;cursor:pointer}
</style></head><body><canvas id="sky"></canvas><div id="planet"></div><div class="ship" id="ship"><div class="hp"><i id="hp"></i></div><svg viewBox="0 0 300 150"><defs><linearGradient id="hl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d8def0"/><stop offset=".45" stop-color="#7c86a8"/><stop offset="1" stop-color="#262c48"/></linearGradient><radialGradient id="cp" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#ff6b8a"/><stop offset="1" stop-color="#7a1040"/></radialGradient></defs><path d="M6 86 74 58l36-30h96l34 30 54 28-54 10-34 26H106L74 96Z" fill="url(#hl)" stroke="#11152a" stroke-width="3"/><path d="M116 28h84l-8-16h-64Z" fill="#3a4266"/><ellipse cx="156" cy="66" rx="42" ry="22" fill="url(#cp)"/><path d="M30 86h240" stroke="#ff3d6e" stroke-width="3" opacity=".8"/><rect x="108" y="108" width="20" height="24" rx="4" fill="#2a3050"/><rect x="186" y="108" width="20" height="24" rx="4" fill="#2a3050"/><circle cx="118" cy="134" r="7" fill="#ffb02e"/><circle cx="196" cy="134" r="7" fill="#ffb02e"/></svg></div><div class="w"><div class="top"><div class="lv"><span id="lv"></span> <span class="kills" id="kills"></span></div><button class="ib" id="mute" type="button" aria-label="Звук">🔇</button></div><div class="task" id="task"></div><div class="say" id="say"></div><div class="bar" id="bar"></div><div class="calc" id="calc"></div><div class="opts" id="opts"></div></div>
<script>
/*CORE*/
const L=[[1,2,40],[1,4,20],[3,4,20],[4,5,20],[2,3,30],[3,5,40],[5,8,24],[7,10,50],[6,5,80],[5,4,40],[7,5,20],[3,2,60]];
const mix=(a,part,tot,n,R)=>{const s=new Set([tot]);for(const v of [tot+part,tot-part,a*n,a+part,part*(n+1)])if(s.size<3&&v>0&&v!==tot)s.add(v);return [...s].sort(()=>R()-.5)};
/*END*/
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let i=0,n,d,a,part,on=0,segs=0,muted=true,ac=null,errs=[];
function tone(f,t=.12,dl=0){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+dl;o.frequency.value=f;g.gain.setValueAtTime(.09,s);g.gain.exponentialRampToValueAtTime(.001,s+t);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+t)}catch(e){}}
$('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};
function opt(list,fn){const o=$('opts');o.replaceChildren();list.forEach(v=>{const b=el('button','o',String(v));b.type='button';b.onclick=()=>fn(v,b);o.append(b)})}
const sky=$('sky'),cx=sky.getContext('2d');let SW,SH,ST=[],bits=[];function rs(){SW=sky.width=innerWidth;SH=sky.height=innerHeight;ST=Array.from({length:220},()=>({x:Math.random()*SW,y:Math.random()*SH,z:.2+Math.random()*1.6}))}addEventListener('resize',rs);rs();
function skyf(){requestAnimationFrame(skyf);const g=cx.createRadialGradient(SW*.75,SH*.2,20,SW*.5,SH*.5,Math.max(SW,SH)*.8);g.addColorStop(0,'#3a2a8a');g.addColorStop(.45,'#101a56');g.addColorStop(1,'#04050f');cx.fillStyle=g;cx.fillRect(0,0,SW,SH);ST.forEach(s=>{s.x-=s.z*.5;if(s.x<0){s.x=SW;s.y=Math.random()*SH}cx.fillStyle=`rgba(255,255,255,${.3+s.z*.4})`;cx.fillRect(s.x,s.y,s.z*1.5,s.z*1.5)});cx.globalCompositeOperation='lighter';bits=bits.filter(b=>b.l>0);bits.forEach(b=>{b.x+=b.vx;b.y+=b.vy;b.vy+=.05;b.l-=.016;cx.globalAlpha=Math.max(0,b.l);cx.fillStyle=b.c;cx.beginPath();cx.arc(b.x,b.y,b.r,0,7);cx.fill()});cx.globalAlpha=1;cx.globalCompositeOperation='source-over'}skyf();
function boom(x,y){const C=['#fff','#ffd166','#ff7a3c','#ff3d6e','#7df9ff'];for(let k=0;k<110;k++){const t=Math.random()*6.28,v=1+Math.random()*7;bits.push({x,y,vx:Math.cos(t)*v,vy:Math.sin(t)*v,l:1,r:1.5+Math.random()*3.5,c:C[k%5]})}}
function newShip(){const h=$('ship');h.className='ship';void h.offsetWidth;h.classList.add('in');h.style.filter=`hue-rotate(${i*47}deg)`;$('hp').style.width='100%';$('kills').textContent='· СБИТО '+i}
function fire(cb){const b=$('bar').getBoundingClientRect(),t=$('ship').getBoundingClientRect(),x0=b.left+b.width/2,y0=b.top,x1=t.left+t.width/2,y1=t.top+t.height/2,len=Math.hypot(x1-x0,y1-y0),z=document.createElement('div');z.className='shot';z.style.left=x0+'px';z.style.top=y0+'px';z.style.width=len+'px';z.style.transform=`rotate(${Math.atan2(y1-y0,x1-x0)}rad)`;document.body.append(z);tone(1200,.3);setTimeout(()=>{z.remove();$('hp').style.width='0';$('ship').className='ship dead';boom(x1,y1);tone(120,.5);tone(80,.6,.05);setTimeout(cb,650)},260)}
function start(){newShip();[n,d,a]=L[i];part=a/d;on=0;segs=0;$('lv').textContent='УРОВЕНЬ '+(i+1)+' / '+L.length;const t=$('task');t.textContent=n+'/'+d+' от '+a;t.append(el('small',null,n+'/'+d+' of '+a+(n>d?' — больше целого!':'')));$('calc').textContent='';const b=$('bar');b.replaceChildren(el('div','whole',String(a)));$('say').textContent='Шаг 1. На сколько равных частей резать?';opt([2,3,4,5,6,8,10],(v,bt)=>{if(v!==d){errs.push(n+'/'+d+' от '+a+': резал на '+v);bt.classList.add('no');bt.disabled=true;$('say').textContent='Смотри на нижнее число дроби';tone(180);return}cut()})}
function cut(){const b=$('bar');b.replaceChildren();segs=d;for(let k=0;k<d;k++)b.append(seg());tone(900,.2);for(let k=1;k<d;k++){const z=el('div','beam');z.style.left=k/d*100+'%';b.append(z);setTimeout(()=>z.remove(),460)}$('say').textContent='Шаг 2. Сколько в одной части?';$('calc').textContent=a+' : '+d+' = ?';opt([...new Set([part,d,part+1,a-d>0?a-d:part+2])].slice(0,3).sort(()=>Math.random()-.5),(v,bt)=>{if(v!==part){errs.push(a+' : '+d+' ответил '+v);bt.classList.add('no');bt.disabled=true;$('say').textContent='Раздели '+a+' поровну на '+d+' части';tone(180);return}tone(700);$('calc').textContent=a+' : '+d+' = '+part;[...b.querySelectorAll('.seg')].forEach(s=>{s.textContent=part});light()})}
function seg(){const s=el('button','seg');s.type='button';return s}
function light(){const b=$('bar');$('opts').replaceChildren();$('say').textContent='Шаг 3. Верхнее число '+n+': включи '+n+' '+(n<5&&n>1?'части':n===1?'часть':'частей');[...b.querySelectorAll('.seg')].forEach(s=>{s.classList.add('can');s.onclick=()=>tap(s)});if(n>d)$('opts').append(addBtn())}
function addBtn(){const q=el('button','o add','+ ещё часть');q.type='button';q.onclick=()=>{if(segs>=n)return;const s=seg();s.textContent=part;s.classList.add('can');s.onclick=()=>tap(s);$('bar').append(s);segs++;tone(620);$('say').textContent='Частей больше, чем в целом: '+segs+'/'+d;if(segs>=n)q.remove()};return q}
function tap(s){if(s.classList.contains('on')){s.classList.remove('on');on--}else{if(on>=n)return;s.classList.add('on');on++;tone(520+on*40,.08)}$('calc').textContent=on?Array(on).fill(part).join(' + '):'';if(on===n)total()}
function total(){const b=$('bar');b.querySelectorAll('.seg').forEach(s=>{s.onclick=null;s.classList.remove('can')});$('say').textContent='Шаг 4. Сколько всего?';const tot=n*part;$('calc').textContent=n+' × '+part+' = ?';opt(mix(a,part,tot,n,Math.random),(v,bt)=>{if(v!==tot){errs.push(n+' × '+part+' ответил '+v);bt.classList.add('no');bt.disabled=true;$('say').textContent='Сложи включённые части';tone(180);return}$('calc').textContent=n+'/'+d+' от '+a+' = '+a+' : '+d+' × '+n+' = '+tot;$('say').textContent='Залп!';const o=$('opts');o.replaceChildren();fire(()=>{$('say').textContent='Корабль сбит!';$('kills').textContent='· СБИТО '+(i+1);const nx=el('button','btn',i+1<L.length?'Следующий корабль':'Готово');nx.type='button';nx.onclick=()=>{i++;i<L.length?start():end()};o.append(nx)})})}
function end(){const ov=el('div','ov'),m=el('div','box');m.append(el('h1',null,'Флот уничтожен!'),el('p',null,'Правило: делим на нижнее, умножаем на верхнее.'),el('p',null,'Ошибок: '+errs.length));const u=el('p',null,errs.slice(-4).join('; '));m.append(u);const b=el('button','btn','Сначала');b.type='button';b.onclick=()=>{ov.remove();i=0;errs=[];start()};m.append(b);ov.append(m);document.body.append(ov)}
start();
</script></body></html>
