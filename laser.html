<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fraction Laser</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{background:radial-gradient(ellipse at 50% 30%,#22307a,#0b1030 55%,#05060f);color:#e8f3ff;font:700 18px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;overflow:hidden}
.w{max-width:980px;margin:0 auto;height:100%;padding:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}.lv{font:800 15px ui-monospace,Menlo,Consolas,monospace;color:#7df9ff;letter-spacing:.06em}
.task{font:900 clamp(40px,7vw,64px)/1 ui-monospace,Menlo,Consolas,monospace;color:#fff;text-shadow:0 0 20px #7df9ff;text-align:center}.task small{display:block;font:700 16px system-ui,sans-serif;color:#9fb3c8;margin-top:6px}
.say{font-size:clamp(19px,2.6vw,24px);font-weight:800;color:#ffd166;text-align:center;min-height:32px}
.bar{position:relative;width:100%;height:clamp(96px,17vh,130px);display:flex;gap:4px;padding:6px;border-radius:14px;background:#0a0f26;box-shadow:0 0 0 2px #2d3f8a,0 0 30px #2c6bff55}
.seg{flex:1;min-width:0;border:0;border-radius:9px;background:linear-gradient(180deg,#1b2a66,#121b47);color:#cfe3ff;font:900 clamp(18px,3vw,28px) ui-monospace,Menlo,Consolas,monospace;cursor:default;transition:background .15s,box-shadow .15s,transform .15s}
.seg.can{cursor:pointer}.seg.can:hover{transform:translateY(-3px)}.seg.on{background:linear-gradient(180deg,#a5fff0,#22d3c5);color:#04202a;box-shadow:0 0 22px #5cf2e0}
.whole{flex:1;display:grid;place-items:center;font:900 clamp(30px,5vw,46px) ui-monospace,Menlo,Consolas,monospace;border-radius:9px;background:linear-gradient(90deg,#1b2a66,#2c6bff,#1b2a66);text-shadow:0 0 12px #fff}
.beam{position:absolute;top:-16px;bottom:-16px;width:4px;background:#ff5ca8;box-shadow:0 0 16px 4px #ff5ca8;animation:zap .45s forwards}@keyframes zap{from{opacity:1;transform:scaleY(.2)}60%{opacity:1;transform:scaleY(1)}to{opacity:0}}
.opts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.o{font:900 clamp(22px,3.4vw,30px) ui-monospace,Menlo,Consolas,monospace;min-width:72px;min-height:64px;padding:0 16px;color:#fff;background:#141d4a;border:2px solid #3a55c0;border-radius:12px;cursor:pointer}.o:hover{border-color:#7df9ff}.o.no{opacity:.3}.o.add{border-color:#ffd166;color:#ffd166}
.calc{font:800 clamp(20px,3vw,26px) ui-monospace,Menlo,Consolas,monospace;color:#a5fff0;min-height:34px;text-align:center}
.ib{background:#10162c;color:#fff;border:1px solid #2a3560;border-radius:9px;min-width:42px;min-height:38px;cursor:pointer}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:#03040ccc;z-index:5;padding:16px;text-align:center}.box{max-width:540px;background:#0c1228;border-top:3px solid #7df9ff;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:11px;align-items:center}.box h1{margin:0;font-size:32px;color:#7df9ff}.box p{margin:0}.btn{font:800 18px system-ui,sans-serif;background:#7df9ff;color:#04202a;border:0;border-radius:9px;min-height:50px;padding:0 28px;cursor:pointer}
</style></head><body><div class="w"><div class="top"><div class="lv" id="lv"></div><button class="ib" id="mute" type="button" aria-label="Звук">🔇</button></div><div class="task" id="task"></div><div class="say" id="say"></div><div class="bar" id="bar"></div><div class="calc" id="calc"></div><div class="opts" id="opts"></div></div>
<script>
/*CORE*/
const L=[[1,2,40],[1,4,20],[3,4,20],[4,5,20],[2,3,30],[3,5,40],[5,8,24],[7,10,50],[6,5,80],[5,4,40],[7,5,20],[3,2,60]];
const mix=(a,part,tot,n,R)=>{const s=new Set([tot]);for(const v of [tot+part,tot-part,a*n,a+part,part*(n+1)])if(s.size<3&&v>0&&v!==tot)s.add(v);return [...s].sort(()=>R()-.5)};
/*END*/
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let i=0,n,d,a,part,on=0,segs=0,muted=true,ac=null,errs=[];
function tone(f,t=.12,dl=0){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+dl;o.frequency.value=f;g.gain.setValueAtTime(.09,s);g.gain.exponentialRampToValueAtTime(.001,s+t);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+t)}catch(e){}}
$('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};
function opt(list,fn){const o=$('opts');o.replaceChildren();list.forEach(v=>{const b=el('button','o',String(v));b.type='button';b.onclick=()=>fn(v,b);o.append(b)})}
function start(){[n,d,a]=L[i];part=a/d;on=0;segs=0;$('lv').textContent='УРОВЕНЬ '+(i+1)+' / '+L.length;const t=$('task');t.textContent=n+'/'+d+' от '+a;t.append(el('small',null,n+'/'+d+' of '+a+(n>d?' — больше целого!':'')));$('calc').textContent='';const b=$('bar');b.replaceChildren(el('div','whole',String(a)));$('say').textContent='Шаг 1. На сколько равных частей резать?';opt([2,3,4,5,6,8,10],(v,bt)=>{if(v!==d){errs.push(n+'/'+d+' от '+a+': резал на '+v);bt.classList.add('no');bt.disabled=true;$('say').textContent='Смотри на нижнее число дроби';tone(180);return}cut()})}
function cut(){const b=$('bar');b.replaceChildren();segs=d;for(let k=0;k<d;k++)b.append(seg());tone(900,.2);for(let k=1;k<d;k++){const z=el('div','beam');z.style.left=k/d*100+'%';b.append(z);setTimeout(()=>z.remove(),460)}$('say').textContent='Шаг 2. Сколько в одной части?';$('calc').textContent=a+' : '+d+' = ?';opt([...new Set([part,d,part+1,a-d>0?a-d:part+2])].slice(0,3).sort(()=>Math.random()-.5),(v,bt)=>{if(v!==part){errs.push(a+' : '+d+' ответил '+v);bt.classList.add('no');bt.disabled=true;$('say').textContent='Раздели '+a+' поровну на '+d+' части';tone(180);return}tone(700);$('calc').textContent=a+' : '+d+' = '+part;[...b.querySelectorAll('.seg')].forEach(s=>{s.textContent=part});light()})}
function seg(){const s=el('button','seg');s.type='button';return s}
function light(){const b=$('bar');$('opts').replaceChildren();$('say').textContent='Шаг 3. Верхнее число '+n+': включи '+n+' '+(n<5&&n>1?'части':n===1?'часть':'частей');[...b.querySelectorAll('.seg')].forEach(s=>{s.classList.add('can');s.onclick=()=>tap(s)});if(n>d)$('opts').append(addBtn())}
function addBtn(){const q=el('button','o add','+ ещё часть');q.type='button';q.onclick=()=>{if(segs>=n)return;const s=seg();s.textContent=part;s.classList.add('can');s.onclick=()=>tap(s);$('bar').append(s);segs++;tone(620);$('say').textContent='Частей больше, чем в целом: '+segs+'/'+d;if(segs>=n)q.remove()};return q}
function tap(s){if(s.classList.contains('on')){s.classList.remove('on');on--}else{if(on>=n)return;s.classList.add('on');on++;tone(520+on*40,.08)}$('calc').textContent=on?Array(on).fill(part).join(' + '):'';if(on===n)total()}
function total(){const b=$('bar');b.querySelectorAll('.seg').forEach(s=>{s.onclick=null;s.classList.remove('can')});$('say').textContent='Шаг 4. Сколько всего?';const tot=n*part;$('calc').textContent=n+' × '+part+' = ?';opt(mix(a,part,tot,n,Math.random),(v,bt)=>{if(v!==tot){errs.push(n+' × '+part+' ответил '+v);bt.classList.add('no');bt.disabled=true;$('say').textContent='Сложи включённые части';tone(180);return}$('calc').textContent=n+'/'+d+' от '+a+' = '+a+' : '+d+' × '+n+' = '+tot;$('say').textContent='Заряд готов!';[660,880,1100].forEach((f,k)=>tone(f,.15,k*.08));const o=$('opts');o.replaceChildren();const nx=el('button','btn',i+1<L.length?'Дальше':'Готово');nx.type='button';nx.onclick=()=>{i++;i<L.length?start():end()};o.append(nx)})}
function end(){const ov=el('div','ov'),m=el('div','box');m.append(el('h1',null,'Все батареи заряжены!'),el('p',null,'Правило: делим на нижнее, умножаем на верхнее.'),el('p',null,'Ошибок: '+errs.length));const u=el('p',null,errs.slice(-4).join('; '));m.append(u);const b=el('button','btn','Сначала');b.type='button';b.onclick=()=>{ov.remove();i=0;errs=[];start()};m.append(b);ov.append(m);document.body.append(ov)}
start();
</script></body></html>
