<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Term Reactor</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05060f;color:#e8f3ff;font:600 17px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:grab}canvas:active{cursor:grabbing}
.hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 18px;pointer-events:none;z-index:2}
.lv{font:800 15px ui-monospace,Menlo,Consolas,monospace;color:#7df9ff;letter-spacing:.08em}.goal{font-size:21px;font-weight:800;margin-top:3px}.ru{color:#9fb3c8;font-size:15px;font-weight:500}
.en{display:flex;gap:5px;margin-top:6px}.en i{width:30px;height:9px;border-radius:5px;background:#7df9ff;box-shadow:0 0 10px #7df9ff}.en i.off{background:#223;box-shadow:none}
.expr{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);font:800 clamp(24px,3.4vw,36px) ui-monospace,Menlo,Consolas,monospace;color:#fff;text-shadow:0 0 14px #7df9ff;white-space:nowrap;pointer-events:none;z-index:2}
.msg{position:fixed;left:50%;top:92px;transform:translateX(-50%);font-weight:800;font-size:19px;padding:6px 16px;border-radius:8px;background:#0b1024cc;opacity:0;transition:opacity .2s;pointer-events:none;z-index:2;white-space:nowrap}.msg.on{opacity:1}
.ib{pointer-events:auto;background:#10162c;color:#fff;border:1px solid #2a3560;border-radius:9px;min-width:42px;min-height:38px;cursor:pointer}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:#03040ccc;z-index:5;padding:16px;text-align:center}
.box{max-width:560px;background:#0c1228;border:1px solid #2a3560;border-top:3px solid #7df9ff;border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:11px;align-items:center}.box h1{margin:0;font-size:32px;color:#7df9ff}.box p{margin:0}.box ul{text-align:left;margin:0;padding-left:20px;font-weight:500}.box b{color:#ffd166}
.btn{font:800 18px system-ui,sans-serif;background:#7df9ff;color:#04202a;border:0;border-radius:9px;min-height:50px;padding:0 28px;cursor:pointer;box-shadow:0 0 18px #7df9ff80}
</style></head><body><canvas id="c"></canvas>
<div class="hud"><div><div class="lv" id="lv"></div><div class="goal" id="goal"></div><div class="ru" id="ru"></div><div class="en" id="en"></div></div><button class="ib" id="mute" type="button" aria-label="Sound">🔇</button></div>
<div class="msg" id="msg"></div><div class="expr" id="expr"></div>
<script>
/*CORE*/
// term: c коэффициент, v переменная ('' = число). Скобка: {m, kids:[...]}
const T=(c,v='')=>({c,v});
const LEVELS=[
 {en:'Collect like terms',ru:'Приведи подобные слагаемые',items:[T(3,'a'),T(2,'b'),T(1,'a'),T(-1,'b')]},
 {en:'Collect like terms',ru:'Числа тоже складываются',items:[T(5,'x'),T(3),T(2,'x'),T(4)]},
 {en:'Negative terms',ru:'Осторожно с минусом',items:[T(4,'y'),T(-1,'y'),T(6),T(-2)]},
 {en:'Cancel out',ru:'Противоположные взаимно уничтожаются',items:[T(2,'a'),T(5,'b'),T(-2,'a'),T(3,'b'),T(1)]},
 {en:'Cancel out',ru:'Останется самое простое выражение',items:[T(7,'m'),T(-3),T(-4,'m'),T(3),T(1,'m')]},
 {en:'Expand the bracket',ru:'Брось множитель на каждое слагаемое в скобке',items:[{m:2,kids:[T(1,'x'),T(4)]},T(3,'x')]},
 {en:'Expand and simplify',ru:'Сначала раскрой, потом приведи',items:[{m:3,kids:[T(1,'a'),T(-2)]},T(1,'a')]},
 {en:'Negative multiplier',ru:'Минус на минус даёт плюс',items:[{m:-2,kids:[T(1,'x'),T(-3)]},T(5,'x')]},
 {en:'Two brackets',ru:'Финальный реактор',items:[{m:4,kids:[T(1,'y'),T(1)]},{m:2,kids:[T(1,'y'),T(-3)]}]}];
const fmtT=(c,v,first)=>{const a=Math.abs(c),s=(a===1&&v?'':a)+v;return first?(c<0?'−':'')+s:(c<0?' − ':' + ')+s};
const fmtExpr=ts=>{if(!ts.length)return '0';return ts.map((t,i)=>fmtT(t.c,t.v,i===0)).join('')};
const canon=ts=>{const m={};ts.forEach(t=>m[t.v]=(m[t.v]||0)+t.c);return Object.keys(m).sort((a,b)=>(b>a?1:-1)).filter(k=>m[k]).map(k=>T(m[k],k))};
const flat=L=>L.items.flatMap(i=>i.m!==undefined?i.kids.map(k=>T(k.c*i.m,k.v)):[i]);
/*END*/
const cv=document.getElementById('c'),x=cv.getContext('2d'),$=id=>document.getElementById(id);
let W=0,H=0,DPR=Math.min(devicePixelRatio,2),orbs=[],sparks=[],waves=[],lv=0,en=5,drag=null,mx=0,my=0,uid=0,muted=true,ac=null,log=[],errs=0,won=false,started=false,msgT=0,flash=0,shake=0;
function size(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;x.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',size);size();
function tone(f,d,t=0,ty='sine'){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(.09,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
$('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};
const COL={a:'#ff5ca8',b:'#ffd166',x:'#5cf2a0',y:'#b18cff',m:'#ff9f5c','':'#7df9ff',M:'#ffffff'};
const R=(orb)=>orb.kind==='M'?32:34+Math.min(14,String(lab(orb)).length*3);
const lab=o=>o.kind==='M'?'×'+(o.c<0?'(−'+-o.c+')':o.c):fmtT(o.c,o.v,true);
function mk(c,v,opt={}){const a=Math.random()*6.28,rr=Math.min(W,H)*.26+Math.random()*70;return{id:uid++,c,v,kind:'T',x:W/2+Math.cos(a)*rr*1.3,y:H/2+Math.sin(a)*rr*.8,vx:(Math.random()-.5)*.5,vy:(Math.random()-.5)*.5,pulse:Math.random()*6,...opt}}
function load(n){lv=n;en=5;orbs=[];sparks=[];waves=[];won=false;const L=LEVELS[n];L.items.forEach((it,i)=>{if(it.m!==undefined){const g=uid++,cx=W/2+(i%2?1:-1)*W*.2,cy=H/2+(i?70:-40);const M=mk(it.m,'',{kind:'M',g,x:cx,y:cy-90,need:it.kids.length});orbs.push(M);it.kids.forEach((k,j)=>orbs.push(mk(k.c,k.v,{g,locked:true,x:cx-90+j*180,y:cy+40})))}else orbs.push(mk(it.c,it.v))});$('lv').textContent='LEVEL '+(n+1)+' / '+LEVELS.length;$('goal').textContent=L.en;$('ru').textContent=L.ru;drawEn();expr()}
function drawEn(){const e=$('en');e.replaceChildren();for(let i=0;i<5;i++){const d=document.createElement('i');if(i>=en)d.className='off';e.append(d)}}
function expr(){const groups={};let s=[];orbs.filter(o=>o.kind==='T').forEach(o=>s.push(o));const M=orbs.filter(o=>o.kind==='M');let txt='';const free=s.filter(o=>!o.locked);M.forEach(m=>{const k=s.filter(o=>o.g===m.g);const d=orbs.filter(o=>o.g===m.g&&o.kind==='T'&&!o.locked);txt+=(txt?' + ':'')+(m.c<0?'−'+(-m.c===1?'':-m.c):m.c)+'('+fmtExpr(k.filter(o=>o.locked))+')'});if(free.length)txt+=(txt?(free[0].c<0?'':' + '):'')+fmtExpr(free);$('expr').textContent=txt||'0'}
function say(t,c='#fff'){const m=$('msg');m.textContent=t;m.style.color=c;m.classList.add('on');msgT=110}
function burst(px,py,c,n=26,sp=5){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp;sparks.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c})}}
function miss(a,b,why){errs++;en--;drawEn();shake=10;flash=.5;tone(150,.25,0,'sawtooth');say(why,'#ff7b7b');log.push(lab(a)+' + '+lab(b));const d=Math.atan2(b.y-a.y,b.x-a.x)||1;a.x-=Math.cos(d)*60;a.y-=Math.sin(d)*60;a.vx=-Math.cos(d)*3;a.vy=-Math.sin(d)*3;b.vx=Math.cos(d)*3;b.vy=Math.sin(d)*3;if(en<=0){say('Reactor overload. Restart level','#ff7b7b');setTimeout(()=>load(lv),1200)}}
function tryMerge(a,b){if(a.kind==='M'||b.kind==='M'){const m=a.kind==='M'?a:b,t=a.kind==='M'?b:a;if(t.kind==='M')return;if(t.g!==m.g||!t.locked)return miss(a,b,'That term is not inside this bracket');const c0=t.c;t.c*=m.c;t.locked=false;t.g=undefined;burst(t.x,t.y,COL[t.v],22);tone(720,.12);say(fmtT(m.c,'',true)+' × '+fmtT(c0,t.v,true)+' = '+fmtT(t.c,t.v,true),'#7df9ff');m.need--;if(m.need<=0){orbs=orbs.filter(o=>o!==m);burst(m.x,m.y,'#fff',30)}expr();return check()}
 if(a.locked||b.locked)return miss(a,b,'Expand the bracket first');if(a.v!==b.v)return miss(a,b,'Not like terms: '+lab(a)+' and '+lab(b));const c=a.c+b.c,mxx=(a.x+b.x)/2,myy=(a.y+b.y)/2;if(c===0){orbs=orbs.filter(o=>o!==a&&o!==b);burst(mxx,myy,'#ffffff',60,9);waves.push({x:mxx,y:myy,r:10,l:1});shake=8;tone(220,.3);tone(880,.2,.05);say(lab(a)+' and '+lab(b)+' cancel out','#ffd166')}else{b.c=c;b.x=mxx;b.y=myy;orbs=orbs.filter(o=>o!==a);burst(mxx,myy,COL[b.v],32);waves.push({x:mxx,y:myy,r:10,l:.7});tone(600,.1);tone(900,.14,.07)}expr();check()}
function check(){if(won)return;const t=orbs.filter(o=>o.kind==='T'),vs=t.map(o=>o.v);if(orbs.some(o=>o.kind==='M')||new Set(vs).size!==vs.length)return;won=true;[523,659,784,1047].forEach((f,i)=>tone(f,.25,i*.09));orbs.forEach(o=>burst(o.x,o.y,COL[o.v],30));setTimeout(()=>{const n=lv+1,end=n>=LEVELS.length;const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="box"><h1>${end?'Reactor stable!':'Level cleared'}</h1><p>Simplified: <b>${$('expr').textContent}</b></p>${end?`<p>Mistakes: <b>${errs}</b></p>${log.length?'<ul>'+log.slice(-5).map(l=>'<li>'+l+'</li>').join('')+'</ul>':''}`:''}<button class="btn" id="nx">${end?'Play again':'Next level'}</button></div>`;document.body.append(ov);document.getElementById('nx').onclick=()=>{ov.remove();if(end){errs=0;log=[];load(0)}else load(n)}},900)}
function at(px,py){let b=null,d=1e9;for(const o of orbs){const q=Math.hypot(o.x-px,o.y-py);if(q<R(o)+8&&q<d){b=o;d=q}}return b}
cv.addEventListener('pointerdown',e=>{if(!started)return;const o=at(e.clientX,e.clientY);if(o){drag=o;cv.setPointerCapture(e.pointerId)}mx=e.clientX;my=e.clientY});
cv.addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(drag){drag.x=mx;drag.y=my;drag.vx=drag.vy=0}});
cv.addEventListener('pointerup',()=>{if(!drag)return;const a=drag;drag=null;let b=null,d=1e9;for(const o of orbs){if(o===a)continue;const q=Math.hypot(o.x-a.x,o.y-a.y);if(q<R(o)+R(a)-6&&q<d){b=o;d=q}}if(b)tryMerge(a,b)});
function glowOrb(o,t){const r=R(o)*(1+Math.sin(t*.003+o.pulse)*.04),c=o.kind==='M'?'#ffffff':COL[o.v]||'#fff';x.save();x.globalCompositeOperation='lighter';const g=x.createRadialGradient(o.x,o.y,r*.4,o.x,o.y,r*2);g.addColorStop(0,c+'70');g.addColorStop(1,c+'00');x.fillStyle=g;x.beginPath();x.arc(o.x,o.y,r*2,0,7);x.fill();x.restore();const b=x.createRadialGradient(o.x-r*.35,o.y-r*.4,r*.1,o.x,o.y,r);b.addColorStop(0,'#fff');b.addColorStop(.25,c);b.addColorStop(1,'#0b1024');x.fillStyle=b;x.beginPath();x.arc(o.x,o.y,r,0,7);x.fill();x.strokeStyle=c;x.lineWidth=2;x.stroke();x.fillStyle='#fff';x.font=`800 ${r*.62}px ui-monospace,Menlo,Consolas,monospace`;x.textAlign='center';x.textBaseline='middle';x.shadowColor='#000';x.shadowBlur=6;x.fillText(lab(o),o.x,o.y+1);x.shadowBlur=0}
const stars=Array.from({length:150},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.6}));
function frame(t){requestAnimationFrame(frame);x.setTransform(DPR,0,0,DPR,0,0);const sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;if(shake>0)shake-=.5;x.fillStyle='#05060f';x.fillRect(0,0,W,H);const n=x.createRadialGradient(W/2,H/2,20,W/2,H/2,Math.max(W,H)*.7);n.addColorStop(0,'#1a2150');n.addColorStop(.5,'#0b1030');n.addColorStop(1,'#05060f');x.fillStyle=n;x.fillRect(0,0,W,H);x.fillStyle='#ffffff90';stars.forEach(s=>{x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,7);x.fill()});x.translate(sx,sy);x.save();x.translate(W/2,H/2);x.strokeStyle='#7df9ff30';x.lineWidth=2;for(let i=0;i<3;i++){x.rotate(t*.00012*(i+1));x.setLineDash([40,18]);x.beginPath();x.ellipse(0,0,W*.42-i*30,H*.36-i*22,0,0,7);x.stroke()}x.setLineDash([]);x.restore();
 const gs=[...new Set(orbs.filter(o=>o.g!==undefined).map(o=>o.g))];gs.forEach(g=>{const m=orbs.filter(o=>o.g===g);if(m.length<2)return;x.strokeStyle='#ffffff55';x.lineWidth=2;x.setLineDash([8,8]);const M=m.find(o=>o.kind==='M');m.forEach(o=>{if(o!==M&&M){x.beginPath();x.moveTo(M.x,M.y);x.lineTo(o.x,o.y);x.stroke()}});x.setLineDash([])});
 orbs.forEach(o=>{if(o===drag)return;o.x+=o.vx;o.y+=o.vy;o.vx*=.995;o.vy*=.995;if(Math.abs(o.vx)<.12)o.vx+=(Math.random()-.5)*.08;if(Math.abs(o.vy)<.12)o.vy+=(Math.random()-.5)*.08;const r=R(o);if(o.x<r+10){o.x=r+10;o.vx=Math.abs(o.vx)}if(o.x>W-r-10){o.x=W-r-10;o.vx=-Math.abs(o.vx)}if(o.y<120+r){o.y=120+r;o.vy=Math.abs(o.vy)}if(o.y>H-r-70){o.y=H-r-70;o.vy=-Math.abs(o.vy)}});
 for(let i=0;i<orbs.length;i++)for(let j=i+1;j<orbs.length;j++){const a=orbs[i],b=orbs[j];if(a===drag||b===drag)continue;const d=Math.hypot(a.x-b.x,a.y-b.y)||1,mn=R(a)+R(b)+14;if(d<mn){const k=(mn-d)/d*.04,dx=(a.x-b.x)*k,dy=(a.y-b.y)*k;a.x+=dx;a.y+=dy;b.x-=dx;b.y-=dy}}
 orbs.forEach(o=>glowOrb(o,t));if(drag){x.strokeStyle='#ffffff';x.lineWidth=2;x.beginPath();x.arc(drag.x,drag.y,R(drag)+7,0,7);x.stroke()}
 x.globalCompositeOperation='lighter';sparks=sparks.filter(s=>s.l>0);sparks.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vx*=.97;s.vy*=.97;s.l-=.018;x.globalAlpha=Math.max(0,s.l);x.fillStyle=s.c;x.beginPath();x.arc(s.x,s.y,2.6,0,7);x.fill()});waves=waves.filter(w=>w.l>0);waves.forEach(w=>{w.r+=7;w.l-=.03;x.globalAlpha=Math.max(0,w.l);x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.arc(w.x,w.y,w.r,0,7);x.stroke()});x.globalAlpha=1;x.globalCompositeOperation='source-over';x.setTransform(DPR,0,0,DPR,0,0);if(flash>0){x.fillStyle=`rgba(255,40,60,${flash*.3})`;x.fillRect(0,0,W,H);flash-=.03}if(msgT>0&&--msgT===0)$('msg').classList.remove('on')}
(function(){const ov=document.createElement('div');ov.className='ov';ov.innerHTML=`<div class="box"><h1>Term Reactor</h1><p>Drag one orb onto another.</p><ul><li><b>Like terms</b> fuse: 3a + a = 4a</li><li><b>Opposite terms</b> cancel out: b − b = 0</li><li><b>Multiplier</b> ×2: drop it on every term in the bracket</li></ul><p style="color:#9fb3c8">Перетаскивай шары друг на друга. Неподобные оттолкнутся, и реактор потеряет энергию.</p><button class="btn" id="go">Start</button></div>`;document.body.append(ov);document.getElementById('go').onclick=()=>{ov.remove();started=true;load(0)}})();
requestAnimationFrame(frame);
</script></body></html>
