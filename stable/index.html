<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Конюшня</title><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;color:#3a2a18;font:800 22px "Exo 2",system-ui,sans-serif;user-select:none;touch-action:manipulation;background:#bfe8ff}
#bg{position:fixed;inset:0;width:100%;height:100%}
#t{position:fixed;top:8px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:4px 22px;font-size:clamp(28px,6vw,46px);box-shadow:0 5px 0 #0002;white-space:nowrap;z-index:3}#t i{font-style:normal;color:#e8641a}
#say{position:fixed;top:clamp(64px,10vh,84px);left:8px;right:8px;text-align:center;font-size:clamp(17px,2.8vw,23px);z-index:3}#say span{background:#fffd;border-radius:10px;padding:4px 14px;display:inline-block}
#col{position:fixed;left:10px;bottom:10px;background:#fff8e7;border:3px solid #a9743f;border-radius:12px;padding:6px 12px;z-index:3;font-size:clamp(20px,3.4vw,28px);display:grid;grid-template-columns:repeat(3,auto);gap:0 16px;text-align:center}#col small{font-size:13px;color:#8a6a45}#col s{color:#c0392b;text-decoration-thickness:3px;font-size:.75em;margin-right:4px}#col .n{color:#2f8f4e}
#b{position:absolute;left:10px;right:10px;top:clamp(112px,17vh,130px);bottom:120px;display:flex;gap:8px 10px;flex-wrap:wrap;align-content:flex-start;justify-content:center;z-index:2}
.u{border:0;background:none;padding:0;cursor:pointer;transition:transform .12s}.u:active{transform:scale(.9)}.u svg{display:block}.fly{position:fixed;z-index:5;transition:all .42s cubic-bezier(.3,.7,.3,1);pointer-events:none}
#h{position:fixed;right:6px;bottom:0;width:min(34vw,210px);z-index:1;transform-origin:70% 100%}#h.eat{animation:eat .32s 2}#h.happy{animation:hp .5s 3}@keyframes eat{50%{transform:rotate(-5deg) translateY(4px)}}@keyframes hp{50%{transform:translateY(-16px)}}#jaw{transform-origin:100px 170px}#h.eat #jaw{animation:j .16s 4 alternate}@keyframes j{to{transform:rotate(14deg)}}
#g{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:4}#g button{font:800 clamp(19px,3vw,24px) "Exo 2";border:0;border-radius:12px;background:#2fbf71;color:#fff;padding:10px 24px;box-shadow:0 5px 0 #1c8a4f;cursor:pointer;white-space:nowrap}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:#0005;z-index:9;padding:14px}#bx{background:#fff;border-radius:18px;padding:18px 26px;text-align:center;max-width:460px}#bx h1{margin:0 0 6px;color:#e8641a;font-size:clamp(28px,6vw,42px)}#bx p{margin:5px 0;font-size:20px}#bx button{margin-top:10px;font:800 24px "Exo 2";border:0;border-radius:12px;background:#2fbf71;color:#fff;padding:10px 34px;box-shadow:0 5px 0 #1c8a4f;cursor:pointer}[hidden]{display:none!important}</style></head><body>
<svg id="bg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMax slice"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e6f7ff"/></linearGradient><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a8e06a"/><stop offset="1" stop-color="#5fb24a"/></linearGradient></defs><rect width="1000" height="700" fill="url(#sk)"/><circle cx="850" cy="110" r="60" fill="#ffe27a"/><path d="M0 330 Q200 230 420 320 T1000 290 V700 H0Z" fill="#8fce6a"/><g transform="translate(90 190)"><path d="M0 80 L110 0 L220 80 V210 H0Z" fill="#c0492f"/><path d="M-14 86 L110 -8 L234 86" fill="none" stroke="#fff" stroke-width="12"/><rect x="72" y="110" width="76" height="100" fill="#7a2c1b" stroke="#fff" stroke-width="6"/></g><path d="M0 400 Q500 340 1000 400 V700 H0Z" fill="url(#gr)"/><g stroke="#fff" stroke-width="10"><path d="M0 420 H1000M0 460 H1000" /><path d="M60 395V490M240 395V490M420 395V490M600 395V490M780 395V490M960 395V490"/></g></svg>
<div id="t"></div><div id="say"><span></span></div><div id="b"></div><div id="col"></div>
<svg id="h" viewBox="0 0 300 330"><defs><linearGradient id="ho" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d59a58"/><stop offset="1" stop-color="#8f5526"/></linearGradient></defs><path d="M270 330 C280 220 250 120 170 60 L158 22 L136 62 L112 56 L54 150 Q78 150 120 150 L150 150 C156 210 130 280 116 330 Z" fill="url(#ho)"/><path id="jaw" d="M52 150 Q40 190 70 200 Q104 204 124 168 L146 150Z" fill="#b97a3e"/><path d="M160 22 C220 40 288 130 298 330 L270 330 C278 210 236 110 150 62 Z" fill="#4a2a14"/><circle cx="112" cy="104" r="11" fill="#222"/><circle cx="116" cy="100" r="4" fill="#fff"/><ellipse cx="70" cy="168" rx="6" ry="4" fill="#3a2010"/></svg>
<div id="g"><button id="chk" hidden>Показать ответ</button><button id="nx" hidden>Дальше</button></div>
<div id="ov"><div id="bx"><h1>Конюшня</h1><p>Лошадка голодна! Нажимай на морковки.</p><p>Связка = 10 морковок. Не хватает морковок? Развяжи связку!</p><button id="go">Начать</button></div></div>
<script>
const R=[[63,27],[92,58],[245,18],[362,37],[400,25],[531,46]];let r=0,C,B,O,need,bor=[],$=i=>document.getElementById(i);
const say=t=>$('say').firstChild.textContent=t;
const car=(y=0)=>'<g transform="translate(0,'+y+')"><path d="M8 13 Q30 1 60 14 Q30 26 8 13Z" fill="url(#c)" stroke="#c9650d"/><path d="M20 8q3 5 1 10M32 6q3 7 1 14M44 9q2 4 1 9" stroke="#c9650d" fill="none" stroke-width="1.4"/><path d="M8 13 l-8 -7 M8 13 l-9 1 M8 13 l-7 8" stroke="#3f9b3b" stroke-width="3.4" stroke-linecap="round"/></g>';
const df='<defs><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb24d"/><stop offset="1" stop-color="#ee7a12"/></linearGradient></defs>';
const one='<svg width="58" height="26" viewBox="-3 0 66 28">'+df+car()+'</svg>';
const bun='<svg width="62" height="62" viewBox="-3 0 66 66">'+df+[0,1,2,3,4].map(i=>car(i*9)).join('')+'<rect x="24" y="2" width="9" height="56" rx="3" fill="#c0392b"/><text x="28" y="34" text-anchor="middle" font-size="11" fill="#fff" transform="rotate(90 28 32)">10</text></svg>';
const crate='<svg width="84" height="70" viewBox="0 0 110 90"><rect width="110" height="90" rx="6" fill="#b9824a" stroke="#6d4a26" stroke-width="3"/><path d="M0 30H110M0 60H110M36 0V90M74 0V90" stroke="#6d4a26" stroke-width="2"/><text x="55" y="56" text-anchor="middle" font-size="30" fill="#fff" font-weight="800">100</text></svg>';
function col(){const a=C*100+B*10+O;$('col').innerHTML='<small>сотни</small><small>десятки</small><small>единицы</small>'+[['c',C],['b',B],['o',O]].map(([k,v])=>'<div>'+(bor.includes(k)?'<span class="n">'+v+'</span>':v)+'</div>').join('')}
function draw(){const b=$('b');b.innerHTML='';const add=(h,k)=>{const e=document.createElement('button');e.className='u';e.innerHTML=h;e.onclick=()=>tap(k,e);b.append(e)};for(let i=0;i<C;i++)add(crate,'c');for(let i=0;i<B;i++)add(bun,'b');for(let i=0;i<O;i++)add(one,'o');col()}
function fly(e){const a=e.getBoundingClientRect(),h=$('h').getBoundingClientRect(),c=e.cloneNode(true);c.className='fly';c.style.left=a.left+'px';c.style.top=a.top+'px';document.body.append(c);requestAnimationFrame(()=>{c.style.left=h.left+h.width*.2+'px';c.style.top=h.top+h.height*.5+'px';c.style.transform='scale(.4)';c.style.opacity=.3});setTimeout(()=>{c.remove();$('h').classList.remove('eat');void $('h').offsetWidth;$('h').classList.add('eat')},420)}
function tap(k,e){if(!need)return;if(k=='c'){C--;B+=10;bor=['c','b'];say('Открыли ящик: 1 сотня = 10 десятков!')}else if(k=='b'){if(need>=10){fly(e);B--;need-=10;say('Хрум! Целая связка! Осталось скормить '+need)}else{B--;O+=10;bor=['b','o'];say('Развязали связку: 1 десяток = 10 единиц!')}}else{fly(e);O--;need--;say('Хрум! Осталось скормить '+need)}
if(!need){say('Лошадка сыта! Скажи вслух: сколько морковок осталось?');$('chk').hidden=false;$('h').classList.add('happy')}draw()}
function start(){const[a,b]=R[r];C=Math.floor(a/100);B=Math.floor(a/10)%10;O=a%10;need=b;bor=[];$('chk').hidden=true;$('nx').hidden=true;$('h').classList.remove('happy');say('Скорми лошадке '+b+' морковок');$('t').innerHTML=a+' − <i>'+b+'</i>';draw()}
$('go').onclick=()=>{$('ov').hidden=true;start()};
$('chk').onclick=()=>{const[a,b]=R[r];$('t').innerHTML=a+' − <i>'+b+'</i> = '+(a-b);say('Правильно! На столе '+(C*100+B*10+O)+' морковок');$('chk').hidden=true;$('nx').hidden=false;$('nx').textContent=r<R.length-1?'Дальше':'Финиш'};
$('nx').onclick=()=>{r++;if(r<R.length)start();else{r=0;$('ov').hidden=false;$('bx').innerHTML='<h1>Лошадка довольна!</h1><p>Ты вычла все примеры!</p><button onclick="location.reload()">Ещё раз</button>'}};
window.__g={tap:k=>tap(k,document.querySelector('.u')),left:()=>C*100+B*10+O,get need(){return need},get r(){return r}};
</script></body></html>
