<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Конюшня</title><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(#bfe8ff 0 46%,#a7dc7c 46%);color:#3a2a18;font:800 22px "Exo 2",system-ui,sans-serif;user-select:none;touch-action:manipulation}
#t{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:#fff;border-radius:14px;padding:6px 24px;font-size:clamp(30px,6vw,50px);box-shadow:0 6px 0 #0002}#t i{font-style:normal;color:#e8641a}
#say{position:fixed;top:92px;left:50%;transform:translateX(-50%);background:#fffc;border-radius:10px;padding:5px 16px;font-size:clamp(18px,3vw,23px);white-space:nowrap}
#h{position:fixed;right:14px;bottom:80px;width:min(32vw,300px)}#b{position:fixed;left:12px;right:min(35vw,330px);top:140px;bottom:80px;display:flex;gap:12px;flex-wrap:wrap;align-content:flex-start;overflow:hidden}
.u{border:0;background:none;padding:0;cursor:pointer}.u svg{display:block}#g{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px}#g button{font:800 24px "Exo 2";border:0;border-radius:12px;background:#2fbf71;color:#fff;padding:11px 30px;box-shadow:0 5px 0 #1c8a4f;cursor:pointer}</style></head><body><div id="t"></div><div id="say"></div><div id="b"></div>
<svg id="h" viewBox="0 0 300 300"><defs><linearGradient id="ho" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c98a4b"/><stop offset="1" stop-color="#8f5526"/></linearGradient></defs><path d="M250 300 C260 200 240 120 170 60 L150 40 L138 70 L120 62 L60 150 Q44 176 62 190 Q86 204 112 176 L146 150 C150 200 130 250 120 300 Z" fill="url(#ho)"/><path d="M152 42 C200 50 262 120 276 300 L250 300 C258 200 226 110 150 62 Z" fill="#4a2a14"/><circle cx="118" cy="104" r="9" fill="#222"/><circle cx="121" cy="101" r="3" fill="#fff"/><ellipse cx="76" cy="170" rx="6" ry="4" fill="#3a2010"/></svg>
<div id="g"><button id="chk" hidden>Показать ответ</button><button id="nx" hidden>Дальше</button></div>
<script>
const R=[[63,27],[92,58],[245,18],[362,37],[400,25],[531,46]];window.ROUNDS=R;let r=0,C,B,O,need,$=i=>document.getElementById(i);
const carrot='<path d="M6 12 Q30 2 58 14 Q30 24 6 12Z" fill="#f08a24" stroke="#c9650d"/><path d="M6 12 l-7 -6 M6 12 l-8 1 M6 12 l-6 7" stroke="#3f9b3b" stroke-width="3"/>';
const one=()=>'<svg width="64" height="28" viewBox="-4 0 66 26">'+carrot+'</svg>';
const bun=()=>'<svg width="74" height="62" viewBox="-4 0 70 60">'+[0,1,2,3,4].map(i=>'<g transform="translate(0,'+(i*9)+')">'+carrot+'</g>').join('')+'<rect x="20" y="2" width="9" height="50" rx="3" fill="#c0392b"/></svg>';
const crate='<svg width="110" height="90" viewBox="0 0 110 90"><rect width="110" height="90" rx="6" fill="#a9743f" stroke="#6d4a26" stroke-width="3"/><path d="M0 30H110M0 60H110M36 0V90M74 0V90" stroke="#6d4a26" stroke-width="2"/><text x="55" y="56" text-anchor="middle" font-size="30" fill="#fff" font-weight="800">100</text></svg>';
function draw(){const b=$('b');b.innerHTML='';const add=(h,f)=>{const e=document.createElement('button');e.className='u';e.innerHTML=h;e.onclick=f;b.append(e)};for(let i=0;i<C;i++)add(crate,()=>tap('c'));for(let i=0;i<B;i++)add(bun(),()=>tap('b'));for(let i=0;i<O;i++)add(one(),()=>tap('o'));$('t').innerHTML=(C*100+B*10+O+(R[r][1]-need))+' − <i>'+R[r][1]+'</i>'}
function say(t){$('say').textContent=t}
function tap(k){if(!need)return;if(k=='c'){C--;B+=10;say('Открыла ящик: 10 связок!')}else if(k=='b'){B--;if(need>=10){need-=10;say('Лошадка съела связку! Ещё '+need)}else{O+=10;say('Развязали связку: 10 морковок')}}else{O--;need--;say('Хрум! Ещё '+need)}if(!need){say('Лошадка сыта! Сколько морковок осталось?');$('chk').hidden=false}draw()}
function start(){[need,need]=[0,0];const[a,b]=R[r];C=Math.floor(a/100);B=Math.floor(a/10)%10;O=a%10;need=b;$('chk').hidden=true;$('nx').hidden=true;say('Покорми лошадку: нужно '+b+' морковок. Связка = 10');draw();$('t').innerHTML=a+' − <i>'+b+'</i>'}
$('chk').onclick=()=>{const[a,b]=R[r];$('t').innerHTML=a+' − <i>'+b+'</i> = '+(a-b);say('Умница!');$('chk').hidden=true;$('nx').hidden=false;$('nx').textContent=r<R.length-1?'Дальше':'Заново'};$('nx').onclick=()=>{r=(r+1)%R.length;start()};start();window.__g={tap,left:()=>C*100+B*10+O,get need(){return need}};
</script></body></html>
