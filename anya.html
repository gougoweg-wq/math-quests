<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Звёздный курьер</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@700;800;900&display=swap">
<style>:root{--bg:radial-gradient(ellipse at top,#2b2d6e,#120f2e 70%) fixed #120f2e;--fg:#f4f2ff;--muted:#b8b3e0;--panel:#1f1c4a;--line:#3a3680;--accent:#ffcf5c;--accent2:#ff8fd1;--on:#2a1b00;--stage:linear-gradient(#0c0a26,#251f5c);--screen:#0e0c28;--key:#2a2660;--keysh:#120f30;--ok:#6ef0a6;--bad:#ff7a8a;--hintbg:#2f2a6a;--f:"Nunito",system-ui,sans-serif;--fd:"Fredoka","Nunito",sans-serif;--fm:"Fredoka","Nunito",sans-serif;color-scheme:dark}
.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 2s infinite}@keyframes tw{50%{opacity:.2}}
.planet{position:absolute;font-size:46px;bottom:18px;transition:opacity .4s}.planet.done{filter:drop-shadow(0 0 12px #ffcf5c)}
.ship{position:absolute;bottom:70px;font-size:52px;transition:left .8s cubic-bezier(.4,1.3,.5,1);transform:rotate(45deg)}</style>
<link rel="stylesheet" href="base.css"></head><body>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
window.QUEST={title:'Звёздный курьер',icon:'🚀',coin:'⭐',intro:'Развези посылки по планетам! Каждый верный ответ — ракета летит к следующей планете. 6 галактик, от самых простых примеров к сложнее.',playLabel:'Полетели!',
particles:['#ffcf5c','#ff8fd1','#8fd3ff','#fff'],praise:['Доставлено!','Отлично!','Точно!','Супер!'],winIcon:'🪐',winTitle:'Галактика пройдена!',
levels:[
 {name:'До 10',n:8,gen(){if(Math.random()<.5){const a=R(1,8),b=R(1,10-a);return {q:a+' + '+b,a:a+b,hint:'Посчитай на пальчиках от '+a+' ещё '+b,kind:'Счёт до 10'}}const a=R(3,10),b=R(1,a-1);return {q:a+' − '+b,a:a-b,hint:'От '+a+' назад на '+b,kind:'Счёт до 10'}}},
 {name:'Пары до 10',n:8,gen(){const a=R(1,9);return {q:a+' + ? = 10',a:10-a,hint:'Сколько не хватает до 10? Посчитай от '+a+' до 10',kind:'Состав числа 10'}}},
 {name:'До 20',n:8,gen(){if(Math.random()<.5){const a=R(11,17),b=R(1,19-a);return (a%10)+b<10?{q:a+' + '+b,a:a+b,hint:'Десяток не трогаем: '+(a%10)+' + '+b+' = '+((a%10)+b)+', и ещё 10',kind:'До 20 без перехода'}:this.gen()}const a=R(12,19),b=R(1,a%10);return {q:a+' − '+b,a:a-b,hint:'Десяток не трогаем: '+(a%10)+' − '+b,kind:'До 20 без перехода'}}},
 {name:'Через 10',n:8,gen(){if(Math.random()<.6){const a=R(6,9),b=R(11-a,9);return {q:a+' + '+b,a:a+b,hint:a+' + '+(10-a)+' = 10, и ещё '+(b-(10-a)),kind:'Переход через 10'}}const a=R(11,17),b=R(a-9,9);return a-b<10?{q:a+' − '+b,a:a-b,hint:a+' − '+(a-10)+' = 10, и ещё минус '+(b-(a-10)),kind:'Переход через 10'}:this.gen()}},
 {name:'Десятки',n:8,gen(){return pick([()=>{const a=R(1,8),b=R(1,9-a);return {q:a*10+' + '+b*10,a:(a+b)*10,hint:a+' десятка + '+b+' = '+(a+b)+' десятков',kind:'Круглые числа'}},()=>{const a=R(2,9),b=R(1,a-1);return {q:a*10+' − '+b*10,a:(a-b)*10,hint:a+' десятков − '+b,kind:'Круглые числа'}},()=>{const a=R(2,8)*10,b=R(1,9);return {q:a+' + '+b,a:a+b,hint:'Десятки и единицы: '+a+' и '+b,kind:'Круглые числа'}}])()}},
 {name:'Двузначные',n:8,gen(){if(Math.random()<.5){const a=R(21,85),u=a%10;if(u>8)return this.gen();const b=R(1,9-u);return {q:a+' + '+b,a:a+b,hint:'Единицы: '+u+' + '+b+', десятки не меняются',kind:'Двузначные без перехода'}}const a=R(21,89);if(a%10===0)return this.gen();const b=R(1,a%10);return {q:a+' − '+b,a:a-b,hint:'Единицы: '+(a%10)+' − '+b+', десятки не меняются',kind:'Двузначные без перехода'}}}],
onLevel(st,lv){st.innerHTML='';for(let i=0;i<40;i++){const s=document.createElement('i');s.className='star';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.animationDelay=(Math.random()*2)+'s';st.append(s)}
 const pl=['🌍','🪐','🌕','🌑','🌎','🪐','🌕','⭐'];const n=this.levels[lv].n;for(let i=0;i<n;i++){const p=document.createElement('div');p.className='planet';p.textContent=pl[i%pl.length];p.style.left=(8+i*(84/(n-1)))+'%';p.style.transform='translateX(-50%)';st.append(p)}
 const sh=document.createElement('div');sh.className='ship';sh.id='ship';sh.textContent='🚀';sh.style.left='2%';st.append(sh);this._i=0},
onCorrect(st){const n=this.levels.find((l,i)=>st.querySelectorAll('.planet').length===l.n)?.n||6;const ps=st.querySelectorAll('.planet');const p=ps[this._i];if(p){p.classList.add('done');document.getElementById('ship').style.left='calc('+p.style.left+' - 3%)'}this._i++}};
</script><script src="engine.js"></script></body></html>
