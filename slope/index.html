<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Касательная</title><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#060814;color:#eaf2ff;font:700 20px "Exo 2",system-ui,sans-serif;user-select:none;touch-action:none}
canvas{position:fixed;inset:0}#top{position:fixed;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
#f{background:#0c1228e0;border-left:4px solid #27e4ff;border-radius:6px;padding:8px 14px;font-size:clamp(20px,3.6vw,30px)}#f small{display:block;font-size:15px;color:#8fb2d8}
#s{background:#0c1228e0;border-radius:6px;padding:8px 14px;text-align:right}#s small{display:block;font-size:14px;color:#8fb2d8}
#pad{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:#0c1228ee;padding:9px 12px;border-radius:8px;border-top:3px solid #27e4ff}
button{font:800 24px "Exo 2";border:0;border-radius:6px;color:#fff;background:#1c2a50;height:56px;min-width:56px;cursor:pointer}#k{min-width:120px;text-align:center;font-size:30px;color:#27e4ff}#fire{background:linear-gradient(#ff5a1f,#e0102e);padding:0 26px}
#msg{position:fixed;top:92px;left:50%;transform:translateX(-50%);font-size:clamp(20px,3.4vw,28px);text-shadow:0 2px 8px #000;white-space:nowrap}</style></head><body><canvas id="c"></canvas>
<div id="top"><div id="f"></div><div id="s"></div></div><div id="msg"></div>
<div id="pad"><button id="m5">−5</button><button id="m1">−1</button><div id="k">k = 0</div><button id="p1">+1</button><button id="p5">+5</button><button id="fire">ОГОНЬ</button></div>
<script>
const R=[['f(x) = 2x³ − 5','x₀ = −1',x=>2*x**3-5,-1,6,'№10'],['f(x) = 4cos x + 5','x₀ = π/2',x=>4*Math.cos(x)+5,Math.PI/2,-4,'№8'],['y = x⁴ + 3cos x','x₀ = 0',x=>x**4+3*Math.cos(x),0,0,'№20'],['f(x) = 6x − 2cos x','x₀ = π/2',x=>6*x-2*Math.cos(x),Math.PI/2,8,'№40'],['f(x) = x(x³ + 1)','x₀ = 1',x=>x*(x**3+1),1,5,'№30'],['f(x) = 20 − 3x − x²','x₀ = −6',x=>20-3*x-x*x,-6,9,'№51'],['y = x⁷ · ln x','x₀ = 1',x=>x**7*Math.log(x),1,1,'№11, product rule'],['y = (4x − 1)³','x₀ = 0',x=>(4*x-1)**3,0,12,'№23, chain rule'],['f(x) = x²(2x − 1)³','x₀ = 1',x=>x*x*(2*x-1)**3,1,8,'№45'],['f(x) = x / (x² + 1)','x₀ = 0',x=>x/(x*x+1),0,1,'№14, quotient rule']];
window.ROUNDS=R;const c=document.getElementById('c'),g=c.getContext('2d'),$=i=>document.getElementById(i);let W,H,r=0,k=0,tries=0,score=0,shot=null,busy=false,hit=0,best=0,sp=[];
function size(){W=c.width=innerWidth*Math.min(devicePixelRatio,1.5);H=c.height=innerHeight*Math.min(devicePixelRatio,1.5);c.style.width='100%';c.style.height='100%'}addEventListener('resize',size);size();
function view(){const q=R[r],x0=q[3],y0=q[2](x0),dx=1.1,sl=Math.max(Math.abs(q[4]),3);return{x0,y0,xa:x0-dx*1.25,xb:x0+dx*1.25,ya:y0-sl*dx*1.5,yb:y0+sl*dx*1.5,tx:x0+dx}}
function P(v,x,y){const t=H*.2,b=H*.84;return[(x-v.xa)/(v.xb-v.xa)*W,b-(y-v.ya)/(v.yb-v.ya)*(b-t)]}
function draw(now){const v=view(),q=R[r];g.fillStyle='#060814';g.fillRect(0,0,W,H);
g.strokeStyle='#ffffff10';g.lineWidth=1;for(let i=0;i<=16;i++){const x=i/16*W;g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();const y=i/16*H;g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
g.save();g.shadowColor='#ff2bd6';g.shadowBlur=18;g.strokeStyle='#ff2bd6';g.lineWidth=4;g.beginPath();for(let i=0;i<=300;i++){const x=v.xa+(v.xb-v.xa)*i/300,y=q[2](x);if(!isFinite(y))continue;const p=P(v,x,y);i?g.lineTo(...p):g.moveTo(...p)}g.stroke();g.restore();
const y=v.y0+q[4]*(v.tx-v.x0),t=P(v,v.tx,y),o=P(v,v.x0,v.y0),pul=1+.12*Math.sin(now/180);
if(!hit){g.save();g.shadowColor='#ffc62e';g.shadowBlur=26;g.fillStyle='#ffc62e';g.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2+now/900,rr=(i%2?12:28)*pul;g.lineTo(t[0]+Math.cos(a)*rr,t[1]+Math.sin(a)*rr)}g.fill();g.restore()}
if(shot){const e=Math.min(1,(now-shot.t)/380),x=v.x0+(v.xb-v.x0)*e,p=P(v,x,v.y0+shot.k*(x-v.x0));g.save();g.shadowColor='#27e4ff';g.shadowBlur=22;g.strokeStyle='#27e4ff';g.lineWidth=5;g.beginPath();g.moveTo(...o);g.lineTo(...p);g.stroke();g.restore()}
g.save();g.shadowColor='#fff';g.shadowBlur=18;g.fillStyle='#fff';g.beginPath();g.arc(o[0],o[1],10,0,7);g.fill();g.restore();
sp=sp.filter(s=>s.l>0);sp.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.2;s.l-=.02;g.globalAlpha=Math.max(s.l,0);g.fillStyle=s.c;g.fillRect(s.x,s.y,5,5);g.globalAlpha=1});requestAnimationFrame(draw)}
function start(){const q=R[r];k=0;tries=0;hit=0;shot=null;busy=false;$('k').textContent='k = 0';$('f').innerHTML='<small>Задача '+(r+1)+' из '+R.length+' · НМТ '+q[5]+'</small>'+q[0]+', '+q[1];$('s').innerHTML='<small>ОЧКИ</small>'+score;$('msg').textContent='Найди f′(x₀): это наклон луча. Луч должен попасть в звезду.'}
function step(d){if(!busy){k+=d;$('k').textContent='k = '+k}}
function fire(){if(busy)return;busy=true;shot={k,t:performance.now()};setTimeout(()=>{const q=R[r];if(k===q[4]){hit=1;const v=view(),t=P(v,v.tx,v.y0+q[4]*(v.tx-v.x0));for(let i=0;i<70;i++)sp.push({x:t[0],y:t[1],vx:(Math.random()-.5)*11,vy:(Math.random()-.6)*11,l:1,c:i%2?'#ffc62e':'#27e4ff'});const p=[100,70,40][Math.min(tries,2)];score+=p;$('s').innerHTML='<small>ОЧКИ</small>'+score;$('msg').textContent='Попал! f′(x₀) = '+q[4]+', +'+p;setTimeout(()=>{r++;if(r<R.length)start();else{$('msg').textContent='Все цели! Итог: '+score+' из '+R.length*100;$('pad').hidden=true;$('pad').style.display='none'}},1500)}else{tries++;$('msg').textContent=(k>q[4]?'Луч выше':'Луч ниже')+'. Проверь производную и попробуй снова.';setTimeout(()=>{shot=null;busy=false},700)}},420)}
$('m5').onclick=()=>step(-5);$('m1').onclick=()=>step(-1);$('p1').onclick=()=>step(1);$('p5').onclick=()=>step(5);$('fire').onclick=fire;start();requestAnimationFrame(draw);window.__g={set:v=>{k=v},fire,get r(){return r},get score(){return score}};
</script></body></html>
