<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookie Bakery</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:800 20px/1.25 ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:#5a3216;background:linear-gradient(180deg,#ffe9c9 0,#ffd9a8 62%,#d9a066 62%,#b97c43 100%);overflow:hidden;user-select:none}
.w{height:100%;max-width:1000px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;align-items:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}.st{color:#c9a27a;font-size:22px;letter-spacing:2px}.st b{color:#ff9f1c;font-weight:900}
.ib{border:0;background:#fff;border-radius:999px;min-width:44px;min-height:40px;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #d9a066}
.task{font-size:clamp(30px,5vw,46px);color:#fff;background:linear-gradient(180deg,#ff9f4a,#e8701a);padding:6px 30px;border-radius:20px;box-shadow:inset 0 3px 0 #ffffff70,0 6px 0 #b4530f;text-shadow:0 2px 0 #b4530f;white-space:nowrap}
.say{background:#fff;border-radius:16px;padding:6px 18px;box-shadow:0 3px 0 #e8c79c;font-size:clamp(17px,2.4vw,22px);min-height:40px;text-align:center}
.tray{position:relative;flex:1;min-height:0;width:min(640px,100%);padding:14px 16px;background:linear-gradient(180deg,#8d97a6,#59626f);border-radius:18px;box-shadow:inset 0 0 0 6px #b9c2cf,inset 0 8px 16px #0006,0 10px 0 #3c434e,0 18px 22px #5a321660;display:flex;flex-direction:column;justify-content:center;gap:clamp(4px,1vh,10px)}
.row{display:flex;gap:clamp(5px,1vw,10px);align-items:center;justify-content:center;animation:in .3s cubic-bezier(.3,1.5,.5,1)}@keyframes in{from{transform:translateY(-34px);opacity:0}}
.ck{width:clamp(30px,5vh,48px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 30% 30%,#7a4216 0 7%,#0000 8%),radial-gradient(circle at 66% 36%,#5e3110 0 8%,#0000 9%),radial-gradient(circle at 44% 68%,#6d3a12 0 9%,#0000 10%),radial-gradient(circle at 70% 70%,#7a4216 0 6%,#0000 7%),radial-gradient(circle at 36% 30%,#ffd98f,#e6a64e 62%,#b97a2e);box-shadow:0 4px 6px #0006,inset 0 -3px 5px #8f5a1e}
.tray.wide{width:min(900px,100%)}.ck.ex{filter:hue-rotate(-28deg) saturate(1.5) brightness(.8)}.sum{min-width:58px;text-align:center;color:#fff;font-size:clamp(20px,3.4vh,28px);text-shadow:0 2px 3px #0008}
.add{font:900 clamp(20px,3vw,26px) ui-rounded,"Arial Rounded MT Bold",sans-serif;color:#fff;background:linear-gradient(180deg,#5fd07a,#25a24b);border:0;border-radius:999px;min-height:64px;padding:0 34px;cursor:pointer;box-shadow:0 6px 0 #17753a}
.opts{display:flex;gap:14px;min-height:80px;align-items:center}.o{font:900 clamp(30px,4.6vw,44px) ui-rounded,"Arial Rounded MT Bold",sans-serif;min-width:110px;min-height:76px;border:0;border-radius:20px;background:#fff;color:#e8701a;box-shadow:0 6px 0 #e8c79c;cursor:pointer}.o.no{opacity:.3}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:#5a3216b0;z-index:5;padding:16px;text-align:center}.box{background:#fff;border-radius:26px;padding:24px;max-width:520px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 10px 0 #e8c79c}.box h1{margin:0;color:#e8701a;font-size:36px}.box p{margin:0;font-weight:700}
.btn{font:900 24px ui-rounded,"Arial Rounded MT Bold",sans-serif;color:#fff;background:linear-gradient(180deg,#ff9f4a,#e8701a);border:0;border-radius:999px;min-height:60px;padding:0 36px;cursor:pointer;box-shadow:0 6px 0 #b4530f}
</style></head><body><div class="w"><div class="top"><div class="st" id="st"></div><button class="ib" id="mute" type="button" aria-label="Sound">🔇</button></div><div class="task" id="task"></div><div class="say" id="say"></div><div class="tray" id="tray"></div><div class="opts" id="opts"></div></div>
<script>
/*CORE*/
const TS=/hard/.test(location.search)?[[2,11],[3,11],[2,12],[3,12],[4,12],[5,12],[3,13],[4,13],[3,14],[4,15]]:[[3,2],[4,2],[2,5],[3,5],[4,5],[2,10],[3,10],[5,2],[6,5],[5,10]];
const choices=(a,R)=>{const s=new Set([a]);for(const v of [a+2,a-2,a+5,a-5,a+10])if(s.size<3&&v>0)s.add(v);return [...s].sort(()=>R()-.5)};
/*END*/
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
let i=0,rows=0,r,c,muted=true,ac=null,errs=[];
function tone(f,d=.12,t=0){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(.1,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
$('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};
function start(){[r,c]=TS[i];rows=0;$('st').innerHTML=TS.map((_,n)=>n<i?'<b>★</b>':'★').join('');$('task').textContent=r+' rows of '+c;$('say').textContent='Tap the button to bake a row';$('tray').replaceChildren();$('tray').classList.toggle('wide',c>10);const b=el('button','add','+ Bake a row of '+c);b.type='button';b.id='add';b.onclick=addRow;const o=$('opts');o.replaceChildren(b)}
function addRow(){rows++;const w=el('div','row');for(let k=0;k<c;k++)w.append(el('div','ck'+(c>10&&k>=10?' ex':'')));w.append(el('div','sum',String(rows*c)));$('tray').append(w);tone(500+rows*60);if(rows<r){$('say').textContent=Array.from({length:rows},(_,k)=>(k+1)*c).join(', ')+' ...';return}$('say').textContent=c>10?`${r} × 10 = ${r*10}, ${r} × ${c-10} = ${r*(c-10)}. How many altogether?`:Array.from({length:rows},(_,k)=>(k+1)*c).join(', ')+'. How many cookies?';$('task').textContent=r+' × '+c+' = ?';const ans=r*c,o=$('opts');o.replaceChildren();choices(ans,Math.random).forEach(v=>{const b=el('button','o',String(v));b.type='button';b.onclick=()=>{if(v===ans){[660,880,1100].forEach((f,k)=>tone(f,.15,k*.09));$('task').textContent=r+' × '+c+' = '+ans;$('say').textContent='Yes! '+r+' rows of '+c+' make '+ans;o.replaceChildren();const nx=el('button','btn',i+1<TS.length?'Next tray':'Finish');nx.type='button';nx.onclick=()=>{i++;i<TS.length?start():end()};o.append(nx)}else{errs.push(r+' × '+c+': '+v);b.classList.add('no');b.disabled=true;$('say').textContent='Look at the last number on the tray';tone(180,.2)}};o.append(b)})}
function end(){const ov=el('div','ov'),m=el('div','box');m.append(el('h1',null,'Bakery is full!'),el('p',null,'10 trays baked. Mistakes: '+errs.length));const b=el('button','btn','Play again');b.type='button';b.onclick=()=>{ov.remove();i=0;errs=[];start()};m.append(b);ov.append(m);document.body.append(ov)}
(function(){const ov=el('div','ov'),m=el('div','box');m.append(el('h1',null,'Cookie Bakery'),el('p',null,'Bake rows of cookies and count them!'));const b=el('button','btn','Play');b.type='button';b.onclick=()=>{ov.remove();start()};m.append(b);ov.append(m);document.body.append(ov)})();
</script></body></html>
