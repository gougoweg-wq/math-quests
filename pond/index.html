<!doctype html><html lang="LANG"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Frog/LANG/en</title><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#3fd0d8,#1a7fa8);color:#fff;font:800 26px "Exo 2",system-ui,sans-serif;user-select:none;touch-action:manipulation}canvas{position:fixed;inset:0;width:100%;height:100%}#t{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#fff;color:#17324d;border-radius:16px;padding:6px 26px;font-size:clamp(36px,7vw,58px);box-shadow:0 6px 0 #0002;white-space:nowrap}#p{position:fixed;top:16px;left:14px;font-size:30px}</style></head><body><canvas id="c"></canvas><div id="t"></div><div id="p"></div>
<script>
// [число, цель, кувшинки]; ответ = цель − число
const R=[[7,10,[3,5,2]],[6,10,[1,4,6]],[8,10,[2,3,5]],[3,10,[6,7,4]],[5,10,[5,4,6]],[9,10,[1,2,3]],[2,10,[7,8,6]],[4,10,[6,5,3]],[8,13,[3,5,4]],[9,14,[4,5,6]]];window.ROUNDS=R;
const c=document.getElementById('c'),g=c.getContext('2d');let W,H,r=0,hop=null,bad=-1,bt=0,sp=[],fin=0;function sz(){W=c.width=innerWidth*1.5;H=c.height=innerHeight*1.5}addEventListener('resize',sz);sz();
const pad=i=>[W*(.22+.28*i),H*.5];let fx=()=>W*.5,fy=()=>H*.84,F={x:0,y:0},first=1;
function lily(x,y,rr,n,al){g.save();g.translate(x,y);g.scale(1,.62);g.globalAlpha=al;g.fillStyle='#0a5a6a55';g.beginPath();g.arc(8,14,rr,0,7);g.fill();const gr=g.createRadialGradient(-rr*.3,-rr*.3,4,0,0,rr);gr.addColorStop(0,'#8fe36a');gr.addColorStop(1,'#2f9e44');g.fillStyle=gr;g.beginPath();g.moveTo(0,0);g.arc(0,0,rr,.25,6.05);g.closePath();g.fill();g.restore();g.globalAlpha=al;if(n!=null){g.fillStyle='#fff';g.font='800 '+rr*.9+'px "Exo 2"';g.textAlign='center';g.textBaseline='middle';g.fillText(n,x,y);for(let k=0;k<n;k++){g.fillStyle='#ffe066';g.beginPath();g.arc(x-rr*.75+(k%5)*rr*.38,y+rr*.72+(k>4?rr*.24:0),rr*.09,0,7);g.fill()}}g.globalAlpha=1}
function frog(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#37b24d';g.beginPath();g.ellipse(0,0,46,36,0,0,7);g.fill();g.fillStyle='#69db7c';g.beginPath();g.ellipse(0,10,30,20,0,0,7);g.fill();for(const d of[-24,24]){g.fillStyle='#37b24d';g.beginPath();g.arc(d,-34,16,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(d,-36,11,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(d,-34,6,0,7);g.fill()}g.strokeStyle='#1b5e20';g.lineWidth=4;g.beginPath();g.arc(0,-8,20,.3,2.84);g.stroke();g.restore()}
function draw(t){g.clearRect(0,0,W,H);g.strokeStyle='#ffffff22';g.lineWidth=3;for(let i=0;i<7;i++){const y=H*.2+i*H*.12+Math.sin(t/900+i)*8;g.beginPath();g.moveTo(0,y);for(let x=0;x<W;x+=40)g.lineTo(x,y+Math.sin(x/90+t/700+i)*7);g.stroke()}
const q=R[r];lily(W*.5,H*.84,H*.11,null,1);q[2].forEach((n,i)=>{const[x,y]=pad(i);let al=1,yy=y;if(bad==i){const e=(t-bt)/500;al=Math.max(0,1-e);yy=y+e*30}else if(bad>=0&&0)al=1;lily(x,yy+Math.sin(t/600+i)*5,H*.13,n,al)});
if(hop){const e=Math.min(1,(t-hop.t)/450),x=hop.a+(hop.b-hop.a)*e,y=hop.c+(hop.d-hop.c)*e-Math.sin(e*Math.PI)*H*.2;frog(x,y,1.6+Math.sin(e*Math.PI)*.4);if(e>=1)hop.done()}else frog(fx(),fy()-20,1.6);
sp=sp.filter(s=>s.l>0);sp.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=.3;s.l-=.018;g.globalAlpha=Math.max(0,s.l);g.fillStyle=s.c;g.beginPath();g.arc(s.x,s.y,7,0,7);g.fill();g.globalAlpha=1});requestAnimationFrame(draw)}
function show(){const q=R[r];document.getElementById('t').textContent=q[0]+' + ? = '+q[1];document.getElementById('p').textContent=(r+1)+' / '+R.length}
function pick(i){if(hop||fin)return;const q=R[r];if(q[2][i]+q[0]===q[1]){const[x,y]=pad(i);hop={t:performance.now(),a:fx(),b:x,c:fy()-20,d:y-20,done(){hop=null;for(let k=0;k<50;k++)sp.push({x,y,vx:(Math.random()-.5)*14,vy:-Math.random()*13,l:1,c:k%2?'#ffe066':'#fff'});document.getElementById('t').textContent=q[0]+' + '+q[2][i]+' = '+q[1];setTimeout(()=>{r++;if(r<R.length)show();else{fin=1;document.getElementById('t').textContent='★ ★ ★'}},1100);}}}else{bad=i;bt=performance.now();setTimeout(()=>{bad=-1},650)}}
c.addEventListener('pointerdown',e=>{const x=e.clientX*1.5,y=e.clientY*1.5;[0,1,2].forEach(i=>{const[a,b]=pad(i);if(Math.hypot(x-a,(y-b)/.7)<H*.15)pick(i)})});show();requestAnimationFrame(draw);window.__g={pick,get r(){return r},get fin(){return fin}};
</script></body></html>
