<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Конфетная фабрика</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:800 20px/1.25 ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:#4a2c5e;background:linear-gradient(180deg,#ffd9ec 0,#ffeef2 48%,#c7f3ea 48%,#a8e8dc 100%);overflow:hidden;user-select:none}
body:before{content:"";position:fixed;left:0;right:0;top:48%;height:30px;background:repeating-linear-gradient(90deg,#6b5a78 0 34px,#85749a 34px 68px);box-shadow:0 6px 14px #4a2c5e40}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:3}
.stars{display:flex;gap:4px;font-size:22px}.stars i{font-style:normal;color:#e6c3d6}.stars i.on{color:#ffb400;text-shadow:0 2px 0 #c98700}
.ib{border:0;background:#fff;border-radius:999px;min-width:44px;min-height:40px;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #d8b4c8}
.task{position:fixed;left:50%;top:50px;transform:translateX(-50%);font-size:clamp(46px,8vw,76px);color:#fff;-webkit-text-stroke:0;text-shadow:0 4px 0 #c0417e,0 8px 16px #c0417e70;white-space:nowrap;z-index:2}
.say{position:fixed;left:50%;top:clamp(130px,23vh,170px);transform:translateX(-50%);background:#fff;border-radius:20px;padding:8px 20px;box-shadow:0 4px 0 #e6bcd2;white-space:nowrap;z-index:2;font-size:clamp(17px,2.4vw,22px)}
.shelf{position:fixed;left:3%;top:30%;bottom:50%;width:30%;display:flex;flex-wrap:wrap-reverse;gap:6px;align-content:flex-start;align-items:flex-end;justify-content:flex-start;z-index:2}
.box{width:clamp(60px,8vw,88px);height:clamp(50px,6.6vw,72px);border:0;padding:0;border-radius:8px;background:linear-gradient(180deg,#e9b871,#cf954a);box-shadow:inset 0 -6px 0 #b67c35,0 4px 0 #8d5e26;position:relative;cursor:default;color:#fff;font:900 clamp(22px,3vw,30px) ui-rounded,"Arial Rounded MT Bold",sans-serif;text-shadow:0 2px 0 #8d5e26}
.box:before{content:"";position:absolute;left:44%;right:44%;top:0;bottom:0;background:#f7e2bd}
.box span{position:relative}.box.tap{cursor:pointer;animation:wig .7s infinite}@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.box.in{animation:drop .4s cubic-bezier(.3,1.5,.5,1)}@keyframes drop{from{transform:translateY(-60px) scale(1.2)}}
.open{position:fixed;left:50%;top:clamp(232px,37vh,300px);transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,clamp(50px,7vw,70px));gap:6px;padding:12px;background:linear-gradient(180deg,#f4d39c,#e0ae66);border-radius:14px;box-shadow:inset 0 0 0 6px #c88f45,0 8px 0 #8d5e26;z-index:2}
.open.shut{animation:shut .5s}@keyframes shut{40%{transform:translateX(-50%) scale(1.06)}100%{transform:translateX(-50%) scale(.9);opacity:.2}}
.cell{aspect-ratio:1;border-radius:50%;background:#c88f4566;box-shadow:inset 0 3px 5px #8d5e2650;display:grid;place-items:center}
.c{width:86%;aspect-ratio:1;border:0;padding:0;border-radius:50%;cursor:default;position:relative;background:radial-gradient(circle at 34% 28%,#fff 0 12%,var(--k) 42%,var(--d) 100%);box-shadow:0 4px 0 var(--d)}
.c:before,.c:after{content:"";position:absolute;top:32%;width:30%;height:36%;background:var(--k);clip-path:polygon(0 0,100% 50%,0 100%)}.c:before{left:-22%}.c:after{right:-22%;transform:scaleX(-1)}
.c.tap{cursor:pointer;animation:bob 1s infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.pile{position:fixed;left:50%;bottom:4%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:92%;z-index:2}.pile .c{width:clamp(54px,7.4vw,74px)}
.mon{position:fixed;right:3%;top:30%;width:clamp(150px,22vw,250px);z-index:2;transition:transform .15s}.mon.eat{transform:scale(1.14)}.mon svg{display:block;width:100%}.need{position:absolute;left:50%;top:-16px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 #bfe7dd;white-space:nowrap}
.fly{position:fixed;z-index:9;pointer-events:none}
.ask{position:fixed;left:50%;bottom:5%;transform:translateX(-50%);display:flex;gap:16px;z-index:4}
.opt{font:900 clamp(34px,5.4vw,52px) ui-rounded,"Arial Rounded MT Bold",sans-serif;min-width:clamp(100px,15vw,150px);min-height:clamp(84px,12vw,110px);border:0;border-radius:24px;background:#fff;color:#c0417e;box-shadow:0 7px 0 #e6bcd2;cursor:pointer}.opt:active{transform:translateY(4px);box-shadow:0 3px 0 #e6bcd2}.opt.no{opacity:.35}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#4a2c5eb0;padding:16px;text-align:center}
.modal{background:#fff;border-radius:28px;padding:26px;max-width:540px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 10px 0 #e6bcd2}.modal h1{margin:0;font-size:36px;color:#c0417e}.modal p{margin:0;font-weight:700}.modal ol{text-align:left;margin:0;font-weight:700;font-size:17px}
.btn{font:900 24px ui-rounded,"Arial Rounded MT Bold",sans-serif;color:#fff;background:linear-gradient(180deg,#ff7cb0,#e84a8b);border:0;border-radius:999px;min-height:60px;padding:0 38px;cursor:pointer;box-shadow:0 6px 0 #b02f66}
.conf{position:fixed;top:-20px;width:12px;height:16px;z-index:11;animation:cf 1.6s linear forwards;pointer-events:none}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div class="top"><div class="stars" id="stars"></div><button class="ib" id="mute" type="button" aria-label="Звук">🔇</button></div>
<div class="task" id="task"></div><div class="say" id="say"></div><div class="shelf" id="shelf"></div><div class="open" id="open"></div><div class="pile" id="pile"></div><div class="mon" id="mon" hidden></div><div class="ask" id="ask"></div>
<script>
/*CORE*/
const TASKS=[[27,6],[38,7],[46,8],[59,4],[34,-6],[52,-6],[71,-4],[45,-8],[47,5],[33,-7]];
const opts=(ans,R)=>{const s=new Set([ans]);for(const d of [10,-10,1,-1,2])if(s.size<3&&ans+d>0&&(d===10||d===-1||R()>.5))s.add(ans+d);for(let d=2;s.size<3;d++)s.add(ans+d);return [...s].sort(()=>R()-.5)};
/*END*/
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const COL=[['#ff6fa5','#d13c78'],['#ffc23d','#d98f00'],['#5fd0ff','#2496cf'],['#9b7bff','#6a48d6'],['#6be08a','#2fae55']];
let i=0,tens=0,ones=0,left=0,add=true,busy=false,muted=true,ac=null,errs=[],cn=0,asking=false;
function tone(f,d,t=0){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(.1,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
$('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};
function candy(n=cn++){const b=el('button','c');const[k,d]=COL[n%COL.length];b.type='button';b.style.setProperty('--k',k);b.style.setProperty('--d',d);b.setAttribute('aria-label','Конфета');return b}
const MON=`<div class="need" id="need"></div><svg viewBox="0 0 200 200"><ellipse cx="100" cy="186" rx="70" ry="10" fill="#4a2c5e22"/><path d="M34 118C28 58 62 22 100 22s72 36 66 96c-3 34-30 62-66 62s-63-28-66-62Z" fill="#8c6bff"/><path d="M58 58c10-16 24-22 42-22" stroke="#c9b8ff" stroke-width="9" stroke-linecap="round" fill="none"/><circle cx="74" cy="84" r="20" fill="#fff"/><circle cx="126" cy="84" r="20" fill="#fff"/><circle cx="80" cy="88" r="10" fill="#2d1b47"/><circle cx="120" cy="88" r="10" fill="#2d1b47"/><circle cx="84" cy="84" r="3.5" fill="#fff"/><circle cx="124" cy="84" r="3.5" fill="#fff"/><path d="M62 118c8 36 68 36 76 0Z" fill="#4a1538"/><path d="M76 118h12l-6 11ZM112 118h12l-6 11Z" fill="#fff"/><path d="M82 144c10-8 26-8 36 0-10 8-26 8-36 0Z" fill="#ff7cb0"/></svg>`;
function fly(from,to,mk){return new Promise(r=>{const a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),f=mk();f.classList.add('fly');f.style.left=a.left+'px';f.style.top=a.top+'px';f.style.width=a.width+'px';f.style.height=a.height+'px';document.body.append(f);const dx=b.left+b.width/2-a.left-a.width/2,dy=b.top+b.height/2-a.top-a.height/2;const an=f.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy*.5-50}px) scale(1.15)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.9)`}],{duration:320,easing:'ease-in-out'});an.onfinish=()=>{f.remove();r()}})}
function drawShelf(newest){const s=$('shelf');s.replaceChildren();for(let n=0;n<tens;n++){const b=el('button','box'+(n===tens-1&&newest?' in':''));b.type='button';b.append(el('span',null,'10'));b.setAttribute('aria-label','Коробка 10 конфет');if(!add&&ones===0&&left>0&&n===tens-1&&!asking){b.classList.add('tap');b.onclick=unpack}s.append(b)}}
function drawOpen(){const o=$('open');o.className='open';o.replaceChildren();for(let n=0;n<10;n++){const c=el('div','cell');if(n<ones){const k=candy(n);if(!add&&left>0&&n===ones-1&&!asking){k.classList.add('tap');k.onclick=()=>eat(k)}c.append(k)}o.append(c)}}
function say(t){$('say').textContent=t}
function task(){const[a,b]=TASKS[i];add=b>0;tens=Math.floor(a/10);ones=a%10;left=Math.abs(b);asking=false;busy=false;$('task').textContent=a+(add?' + ':' − ')+Math.abs(b);$('ask').replaceChildren();const st=$('stars');st.replaceChildren();TASKS.forEach((_,n)=>st.append(el('i',n<i?'on':'','★')));$('mon').hidden=add;if(!add){$('mon').innerHTML=MON}drawShelf();drawOpen();drawPile();say(add?'Перенеси конфеты в коробку':'Покорми монстрика: нажимай на конфеты');need()}
function need(){const n=$('need');if(n)n.textContent='Хочу ещё: '+left}
function drawPile(){const p=$('pile');p.replaceChildren();if(!add)return;for(let n=0;n<left;n++){const k=candy(n+3);k.classList.add('tap');k.onclick=()=>put(k);p.append(k)}}
async function put(k){if(busy)return;busy=true;const cell=$('open').children[ones];k.style.visibility='hidden';tone(620,.08);await fly(k,cell,()=>{const f=k.cloneNode();f.style.visibility='';f.classList.remove('tap');return f});left--;ones++;k.remove();drawOpen();if(ones===10){tone(880,.2);say('Полная коробка! Это '+(tens+1)*10);$('open').classList.add('shut');await new Promise(r=>setTimeout(r,800));tens++;ones=0;drawShelf(true);drawOpen();if(left>0)say('Ещё осталось '+left+'. Клади дальше')}busy=false;if(left===0)ask()}
async function eat(k){if(busy)return;busy=true;const m=$('mon');k.style.visibility='hidden';await fly(k,m,()=>{const f=k.cloneNode();f.style.visibility='';f.classList.remove('tap');return f});m.classList.add('eat');setTimeout(()=>m.classList.remove('eat'),160);tone(300,.1);left--;ones--;need();busy=false;drawOpen();drawShelf();if(left===0)return ask();if(ones===0)say('Россыпь кончилась. Открой коробку!')}
async function unpack(){if(busy||ones>0||tens<1)return;busy=true;tone(500,.15);tens--;ones=10;busy=false;drawShelf();drawOpen();say('Открыли коробку: 10 конфет. Покорми ещё '+left)}
function ask(){asking=true;drawShelf();drawOpen();const[a,b]=TASKS[i],ans=a+b;say(`${tens} ${tens===1?'коробка':tens<5&&tens>0?'коробки':'коробок'} и ${ones} ${ones===1?'конфета':ones>1&&ones<5?'конфеты':'конфет'}. Сколько всего?`);const box=$('ask');box.replaceChildren();$('pile').replaceChildren();opts(ans,Math.random).forEach(v=>{const b=el('button','opt',String(v));b.type='button';b.onclick=()=>{if(v===ans){tone(660,.1);tone(990,.2,.1);confetti(14);say('Да! '+$('task').textContent+' = '+ans);box.replaceChildren();i++;setTimeout(()=>i<TASKS.length?task():end(),1300)}else{errs.push($('task').textContent+': ответила '+v);b.classList.add('no');b.disabled=true;say('Посчитай: каждая коробка это 10');tone(200,.2)}};box.append(b)})}
function confetti(n){for(let k=0;k<n;k++){const c=el('div','conf');c.style.left=Math.random()*100+'vw';c.style.background=COL[k%5][0];c.style.animationDelay=Math.random()*.3+'s';document.body.append(c);setTimeout(()=>c.remove(),2200)}}
function end(){confetti(40);const ov=el('div','ov'),m=el('div','modal');m.append(el('h1',null,'Все 10 заказов готовы!'),el('p',null,'Монстрик сыт, коробки полные.'));if(errs.length){const o=el('ol');errs.forEach(e=>o.append(el('li',null,e)));m.append(el('p',null,'Для учителя, повторить:'),o)}const b=el('button','btn','Ещё раз');b.type='button';b.onclick=()=>{ov.remove();i=0;errs=[];task()};m.append(b);ov.append(m);document.body.append(ov)}
(function(){const ov=el('div','ov'),m=el('div','modal');m.append(el('h1',null,'Конфетная фабрика'),el('p',null,'Раскладывай конфеты по коробкам. В каждой коробке 10.'));const b=el('button','btn','Играть');b.type='button';b.onclick=()=>{ov.remove();task()};m.append(b);ov.append(m);document.body.append(ov)})();
</script></body></html>
