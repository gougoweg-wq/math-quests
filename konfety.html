<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Конфетная фабрика</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:800 20px/1.25 ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:#4a2c5e;background:#ffe3ef;overflow:hidden;user-select:none}
#scene{position:fixed;inset:0;width:100%;height:100%;z-index:0}.gear{transform-box:fill-box;transform-origin:center;animation:gr 14s linear infinite}.gear.b{animation-direction:reverse;animation-duration:10s}@keyframes gr{to{transform:rotate(360deg)}}.belt{animation:bl 1.4s linear infinite}@keyframes bl{to{transform:translateX(-68px)}}.puff{animation:pf 5s ease-in-out infinite}@keyframes pf{50%{transform:translateY(-14px);opacity:.75}}
.top{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;z-index:3}
.stars{display:flex;gap:4px;font-size:22px}.stars i{font-style:normal;color:#e6c3d6}.stars i.on{color:#ffb400;text-shadow:0 2px 0 #c98700}
.ib{border:0;background:#fff;border-radius:999px;min-width:44px;min-height:40px;font-size:18px;cursor:pointer;box-shadow:0 3px 0 #d8b4c8}
.task{position:fixed;left:50%;top:16px;transform:translateX(-50%);font-size:clamp(44px,7vw,68px);color:#fff;background:linear-gradient(180deg,#ff85b6,#e0407f);padding:6px 40px;border-radius:24px;box-shadow:inset 0 3px 0 #ffffff80,0 7px 0 #a82a60,0 14px 20px #a82a6050;text-shadow:0 3px 0 #a82a60;white-space:nowrap;z-index:2}
.say{position:fixed;left:50%;top:clamp(116px,18vh,138px);transform:translateX(-50%);background:#fff;border-radius:20px;padding:8px 20px;box-shadow:0 4px 0 #e6bcd2;white-space:nowrap;z-index:2;font-size:clamp(17px,2.4vw,22px)}.say:after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-11px;border:11px solid transparent;border-bottom:0;border-top-color:#fff}
.shelf{position:fixed;left:3%;top:30%;bottom:50%;width:30%;display:flex;flex-wrap:wrap-reverse;gap:6px;align-content:flex-start;align-items:flex-end;justify-content:flex-start;z-index:2}
.box{width:clamp(60px,8vw,88px);height:clamp(50px,6.6vw,72px);border:0;padding:0;border-radius:6px 6px 10px 10px;background:linear-gradient(180deg,#ffd38a 0 16%,#f0b45e 16% 19%,#e7a650 19%,#cb8a3a);box-shadow:inset 0 -7px 0 #b0762f,inset 3px 0 0 #ffffff40,0 5px 0 #80541f,0 10px 12px #4a2c5e50;position:relative;cursor:default;color:#fff;font:900 clamp(22px,3vw,30px) ui-rounded,"Arial Rounded MT Bold",sans-serif;text-shadow:0 2px 0 #8d5e26}
.box:before{content:"";position:absolute;left:44%;right:44%;top:0;bottom:0;background:linear-gradient(180deg,#ff85b6,#e0407f)}
.box span{position:relative}.box.tap{cursor:pointer;animation:wig .7s infinite}@keyframes wig{25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.box.in{animation:drop .4s cubic-bezier(.3,1.5,.5,1)}@keyframes drop{from{transform:translateY(-60px) scale(1.2)}}
.open{position:fixed;left:50%;top:clamp(232px,37vh,300px);transform:translateX(-50%);display:grid;grid-template-columns:repeat(5,clamp(50px,7vw,70px));gap:6px;padding:14px;background:linear-gradient(180deg,#ffdca3,#ebb56a);border-radius:18px;box-shadow:inset 0 0 0 7px #cf9548,inset 0 10px 14px #8d5e2650,0 9px 0 #80541f,0 18px 22px #4a2c5e55;z-index:2}
.open.shut{animation:shut .5s}@keyframes shut{40%{transform:translateX(-50%) scale(1.06)}100%{transform:translateX(-50%) scale(.9);opacity:.2}}
.cell{aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(#fff 0 8deg,#ffe0ec 8deg 16deg);box-shadow:inset 0 5px 8px #8d5e2670,0 1px 0 #fff8;display:grid;place-items:center}
.c{width:86%;aspect-ratio:1;border:0;padding:0;border-radius:50%;cursor:default;position:relative;background:radial-gradient(circle at 34% 26%,#ffffffee 0 9%,#ffffff00 22%),conic-gradient(from 20deg,var(--k) 0 12%,#ffffffb0 12% 16%,var(--k) 16% 37%,#ffffffb0 37% 41%,var(--k) 41% 62%,#ffffffb0 62% 66%,var(--k) 66% 87%,#ffffffb0 87% 91%,var(--k) 91%);box-shadow:inset 0 -7px 10px var(--d),inset 0 3px 6px #ffffffa0,0 5px 8px #4a2c5e55}
.c:before,.c:after{content:"";position:absolute;top:32%;width:30%;height:36%;background:linear-gradient(180deg,var(--k),var(--d));clip-path:polygon(0 0,100% 40%,100% 60%,0 100%,18% 50%)}.c:before{left:-22%}.c:after{right:-22%;transform:scaleX(-1)}
.c.tap{cursor:pointer;animation:bob 1s infinite}@keyframes bob{50%{transform:translateY(-5px)}}
.pile{position:fixed;left:50%;bottom:4%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:92%;z-index:2}.pile .c{width:clamp(54px,7.4vw,74px)}
.mon{animation:hop 1.6s ease-in-out infinite;position:fixed;right:3%;top:30%;width:clamp(150px,22vw,250px);z-index:2;transition:transform .15s}.mon.eat{transform:scale(1.14)}.mon svg{display:block;width:100%}.need{position:absolute;left:50%;top:-16px;transform:translateX(-50%);background:#fff;border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 #bfe7dd;white-space:nowrap}
.fly{position:fixed;z-index:9;pointer-events:none}
.ask{position:fixed;left:50%;bottom:5%;transform:translateX(-50%);display:flex;gap:16px;z-index:4}
.opt{font:900 clamp(34px,5.4vw,52px) ui-rounded,"Arial Rounded MT Bold",sans-serif;min-width:clamp(100px,15vw,150px);min-height:clamp(84px,12vw,110px);border:0;border-radius:28px;background:linear-gradient(180deg,#fff,#ffe6f0);color:#c0417e;box-shadow:inset 0 3px 0 #fff,0 7px 0 #e6a4c2,0 14px 18px #4a2c5e40;cursor:pointer}.opt:active{transform:translateY(4px);box-shadow:0 3px 0 #e6bcd2}.opt.no{opacity:.35}
.ov{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#4a2c5eb0;padding:16px;text-align:center}
.modal{background:#fff;border-radius:28px;padding:26px;max-width:540px;display:flex;flex-direction:column;gap:12px;align-items:center;box-shadow:0 10px 0 #e6bcd2}.modal h1{margin:0;font-size:36px;color:#c0417e}.modal p{margin:0;font-weight:700}.modal ol{text-align:left;margin:0;font-weight:700;font-size:17px}
.btn{font:900 24px ui-rounded,"Arial Rounded MT Bold",sans-serif;color:#fff;background:linear-gradient(180deg,#ff7cb0,#e84a8b);border:0;border-radius:999px;min-height:60px;padding:0 38px;cursor:pointer;box-shadow:0 6px 0 #b02f66}
.conf{position:fixed;top:-20px;width:12px;height:16px;z-index:11;animation:cf 1.6s linear forwards;pointer-events:none}@keyframes cf{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes hop{50%{translate:0 -8px}}.spark{position:fixed;z-index:9;color:#ffc23d;font-size:22px;pointer-events:none;text-shadow:0 0 6px #fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<svg id="scene" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc2dd"/><stop offset="1" stop-color="#ffe9f1"/></linearGradient><linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7ecdf"/><stop offset="1" stop-color="#6fd6c6"/></linearGradient><linearGradient id="pp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".4" stop-color="#b9a7e8"/><stop offset="1" stop-color="#7d62c9"/></linearGradient><pattern id="tl" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="none"/><rect width="40" height="40" fill="#ffffff22"/><rect x="40" y="40" width="40" height="40" fill="#ffffff22"/></pattern></defs>
<rect width="1280" height="440" fill="url(#w)"/><g fill="#ffffff55"><rect x="90" y="40" width="170" height="130" rx="20"/><rect x="1020" y="40" width="170" height="130" rx="20"/></g><g fill="#cdeeff"><rect x="102" y="52" width="68" height="106" rx="10"/><rect x="180" y="52" width="68" height="106" rx="10"/><rect x="1032" y="52" width="68" height="106" rx="10"/><rect x="1110" y="52" width="68" height="106" rx="10"/></g><g class="puff" fill="#fff"><circle cx="130" cy="110" r="16"/><circle cx="152" cy="104" r="20"/><circle cx="1146" cy="96" r="18"/><circle cx="1124" cy="104" r="14"/></g>
<g fill="none" stroke="url(#pp)" stroke-width="30"><path d="M-10 214H300q40 0 40-40V-10"/><path d="M1290 228H980q-40 0-40-40V-10"/></g><g fill="#7d62c9"><rect x="322" y="150" width="36" height="12" rx="4"/><rect x="922" y="164" width="36" height="12" rx="4"/></g>
<g class="gear" fill="#ffb24d"><circle cx="1215" cy="310" r="46"/><g id="tt"><rect x="1205" y="250" width="20" height="24" rx="4"/><rect x="1205" y="346" width="20" height="24" rx="4"/><rect x="1155" y="300" width="24" height="20" rx="4"/><rect x="1251" y="300" width="24" height="20" rx="4"/></g><circle cx="1215" cy="310" r="18" fill="#fff4d6"/></g>
<g class="gear b" fill="#ff8fb8"><circle cx="58" cy="330" r="38"/><rect x="50" y="280" width="16" height="20" rx="4"/><rect x="50" y="360" width="16" height="20" rx="4"/><rect x="8" y="322" width="20" height="16" rx="4"/><rect x="88" y="322" width="20" height="16" rx="4"/><circle cx="58" cy="330" r="14" fill="#fff"/></g>
<rect y="440" width="1280" height="280" fill="url(#fl)"/><rect y="440" width="1280" height="280" fill="url(#tl)"/><rect y="404" width="1280" height="44" fill="#57466a"/><g clip-path="none"><g class="belt"><path d="M0 410h1400" stroke="#7b6a92" stroke-width="30" stroke-dasharray="34 34"/></g></g><rect y="440" width="1280" height="10" fill="#3f304f"/><g fill="#2f243c"><circle cx="120" cy="456" r="13"/><circle cx="340" cy="456" r="13"/><circle cx="560" cy="456" r="13"/><circle cx="780" cy="456" r="13"/><circle cx="1000" cy="456" r="13"/><circle cx="1200" cy="456" r="13"/></g></svg>
<div class="top"><div class="stars" id="stars"></div><button class="ib" id="mute" type="button" aria-label="Звук">🔇</button></div>
<div class="task" id="task"></div><div class="say" id="say"></div><div class="shelf" id="shelf"></div><div class="open" id="open"></div><div class="pile" id="pile"></div><div class="mon" id="mon" hidden></div><div class="ask" id="ask"></div>
<script>
/*CORE*/
const TASKS=[[27,6],[38,7],[46,8],[59,4],[34,-6],[52,-6],[71,-4],[45,-8],[47,5],[33,-7]];
const opts=(ans,R)=>{const s=new Set([ans]);for(const d of [10,-10,1,-1,2])if(s.size<3&&ans+d>0&&(d===10||d===-1||R()>.5))s.add(ans+d);for(let d=2;s.size<3;d++)s.add(ans+d);return [...s].sort(()=>R()-.5)};
/*END*/
const $=id=>document.getElementById(id),el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const COL=[['#ff6fa5','#d13c78'],['#ffc23d','#d98f00'],['#5fd0ff','#2496cf'],['#9b7bff','#6a48d6'],['#6be08a','#2fae55']];
let i=0,tens=0,ones=0,left=0,add=true,busy=false,muted=true,ac=null,errs=[],cn=0,asking=false;
function tone(f,d,t=0){if(muted)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.frequency.value=f;g.gain.setValueAtTime(.1,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g).connect(ac.destination);o.start(s);o.stop(s+d)}catch(e){}}
$('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊'};
function candy(n=cn++){const b=el('button','c');const[k,d]=COL[n%COL.length];b.type='button';b.style.setProperty('--k',k);b.style.setProperty('--d',d);b.setAttribute('aria-label','Конфета');return b}
const MON=`<div class="need" id="need"></div><svg viewBox="0 0 200 200"><defs><radialGradient id="mb" cx=".38" cy=".28" r=".8"><stop offset="0" stop-color="#c3b0ff"/><stop offset=".55" stop-color="#8c6bff"/><stop offset="1" stop-color="#5a38c9"/></radialGradient></defs><ellipse cx="100" cy="188" rx="72" ry="10" fill="#2f243c44"/><path d="M58 44 44 8l36 22ZM142 44l14-36-36 22Z" fill="#ffc23d"/><path d="M34 118C28 58 62 22 100 22s72 36 66 96c-3 34-30 62-66 62s-63-28-66-62Z" fill="url(#mb)"/><circle cx="52" cy="128" r="9" fill="#ff9ccc" opacity=".7"/><circle cx="148" cy="128" r="9" fill="#ff9ccc" opacity=".7"/><circle cx="74" cy="84" r="20" fill="#fff"/><circle cx="126" cy="84" r="20" fill="#fff"/><circle cx="80" cy="88" r="10" fill="#2d1b47"/><circle cx="120" cy="88" r="10" fill="#2d1b47"/><circle cx="84" cy="84" r="3.5" fill="#fff"/><circle cx="124" cy="84" r="3.5" fill="#fff"/><path d="M62 118c8 36 68 36 76 0Z" fill="#4a1538"/><path d="M76 118h12l-6 11ZM112 118h12l-6 11Z" fill="#fff"/><path d="M82 144c10-8 26-8 36 0-10 8-26 8-36 0Z" fill="#ff7cb0"/></svg>`;
function fly(from,to,mk){return new Promise(r=>{const a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),f=mk();f.classList.add('fly');f.style.left=a.left+'px';f.style.top=a.top+'px';f.style.width=a.width+'px';f.style.height=a.height+'px';document.body.append(f);const dx=b.left+b.width/2-a.left-a.width/2,dy=b.top+b.height/2-a.top-a.height/2;const an=f.animate([{transform:'translate(0,0) scale(1)'},{transform:`translate(${dx*.5}px,${dy*.5-50}px) scale(1.15)`,offset:.5},{transform:`translate(${dx}px,${dy}px) scale(.9)`}],{duration:320,easing:'ease-in-out'});an.onfinish=()=>{f.remove();r()}})}
function drawShelf(newest){const s=$('shelf');s.replaceChildren();for(let n=0;n<tens;n++){const b=el('button','box'+(n===tens-1&&newest?' in':''));b.type='button';b.append(el('span',null,'10'));b.setAttribute('aria-label','Коробка 10 конфет');if(!add&&ones===0&&left>0&&n===tens-1&&!asking){b.classList.add('tap');b.onclick=unpack}s.append(b)}}
function drawOpen(){const o=$('open');o.className='open';o.replaceChildren();for(let n=0;n<10;n++){const c=el('div','cell');if(n<ones){const k=candy(n);if(!add&&left>0&&n===ones-1&&!asking){k.classList.add('tap');k.onclick=()=>eat(k)}c.append(k)}o.append(c)}}
function spark(el0){const r=el0.getBoundingClientRect();for(let n=0;n<7;n++){const s=el('div','spark','✦');s.style.left=r.left+r.width/2+'px';s.style.top=r.top+r.height/2+'px';document.body.append(s);const a=n*.9,d=46+n*5;s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.3)`,opacity:0}],{duration:480,easing:'ease-out'}).onfinish=()=>s.remove()}}
function say(t){$('say').textContent=t}
function task(){const[a,b]=TASKS[i];add=b>0;tens=Math.floor(a/10);ones=a%10;left=Math.abs(b);asking=false;busy=false;$('task').textContent=a+(add?' + ':' − ')+Math.abs(b);$('ask').replaceChildren();const st=$('stars');st.replaceChildren();TASKS.forEach((_,n)=>st.append(el('i',n<i?'on':'','★')));$('mon').hidden=add;if(!add){$('mon').innerHTML=MON}drawShelf();drawOpen();drawPile();say(add?'Перенеси конфеты в коробку':'Покорми монстрика: нажимай на конфеты');need()}
function need(){const n=$('need');if(n)n.textContent='Хочу ещё: '+left}
function drawPile(){const p=$('pile');p.replaceChildren();if(!add)return;for(let n=0;n<left;n++){const k=candy(n+3);k.classList.add('tap');k.onclick=()=>put(k);p.append(k)}}
async function put(k){if(busy)return;busy=true;const cell=$('open').children[ones];k.style.visibility='hidden';tone(620,.08);await fly(k,cell,()=>{const f=k.cloneNode();f.style.visibility='';f.classList.remove('tap');return f});left--;ones++;k.remove();drawOpen();spark($('open').children[ones-1]);if(ones===10){tone(880,.2);say('Полная коробка! Это '+(tens+1)*10);$('open').classList.add('shut');await new Promise(r=>setTimeout(r,800));tens++;ones=0;drawShelf(true);drawOpen();if(left>0)say('Ещё осталось '+left+'. Клади дальше')}busy=false;if(left===0)ask()}
async function eat(k){if(busy)return;busy=true;const m=$('mon');k.style.visibility='hidden';await fly(k,m,()=>{const f=k.cloneNode();f.style.visibility='';f.classList.remove('tap');return f});m.classList.add('eat');setTimeout(()=>m.classList.remove('eat'),160);tone(300,.1);left--;ones--;need();busy=false;drawOpen();drawShelf();if(left===0)return ask();if(ones===0)say('Россыпь кончилась. Открой коробку!')}
async function unpack(){if(busy||ones>0||tens<1)return;busy=true;tone(500,.15);tens--;ones=10;busy=false;drawShelf();drawOpen();say('Открыли коробку: 10 конфет. Покорми ещё '+left)}
function ask(){asking=true;drawShelf();drawOpen();const[a,b]=TASKS[i],ans=a+b;say(`${tens} ${tens===1?'коробка':tens<5&&tens>0?'коробки':'коробок'} и ${ones} ${ones===1?'конфета':ones>1&&ones<5?'конфеты':'конфет'}. Сколько всего?`);const box=$('ask');box.replaceChildren();$('pile').replaceChildren();opts(ans,Math.random).forEach(v=>{const b=el('button','opt',String(v));b.type='button';b.onclick=()=>{if(v===ans){tone(660,.1);tone(990,.2,.1);confetti(14);say('Да! '+$('task').textContent+' = '+ans);box.replaceChildren();i++;setTimeout(()=>i<TASKS.length?task():end(),1300)}else{errs.push($('task').textContent+': ответила '+v);b.classList.add('no');b.disabled=true;say('Посчитай: каждая коробка это 10');tone(200,.2)}};box.append(b)})}
function confetti(n){for(let k=0;k<n;k++){const c=el('div','conf');c.style.left=Math.random()*100+'vw';c.style.background=COL[k%5][0];c.style.animationDelay=Math.random()*.3+'s';document.body.append(c);setTimeout(()=>c.remove(),2200)}}
function end(){confetti(40);const ov=el('div','ov'),m=el('div','modal');m.append(el('h1',null,'Все 10 заказов готовы!'),el('p',null,'Монстрик сыт, коробки полные.'));if(errs.length){const o=el('ol');errs.forEach(e=>o.append(el('li',null,e)));m.append(el('p',null,'Для учителя, повторить:'),o)}const b=el('button','btn','Ещё раз');b.type='button';b.onclick=()=>{ov.remove();i=0;errs=[];task()};m.append(b);ov.append(m);document.body.append(ov)}
(function(){const ov=el('div','ov'),m=el('div','modal');m.append(el('h1',null,'Конфетная фабрика'),el('p',null,'Раскладывай конфеты по коробкам. В каждой коробке 10.'));const b=el('button','btn','Играть');b.type='button';b.onclick=()=>{ov.remove();task()};m.append(b);ov.append(m);document.body.append(ov)})();
</script></body></html>
