<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Лаборатория</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#04070a;color:#e9f6f2;font:600 20px/1.25 "Exo 2",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#task{position:absolute;top:12px;left:12px;width:min(400px,calc(100vw - 24px));background:#07110eda;border-left:4px solid #3dffb0;border-radius:6px;padding:11px 15px}
#task small{display:flex;justify-content:space-between;color:#7fd8b8;letter-spacing:1px;font-weight:800;margin-bottom:4px}#task b{color:#3dffb0}
#scale{position:absolute;top:12px;right:12px;background:#02140ee6;border:1px solid #3dffb066;border-radius:6px;padding:7px 15px;text-align:right}
#scale small{display:block;font-size:13px;color:#7fd8b8}#scale b{font:900 clamp(28px,5.4vw,42px) Orbitron,sans-serif;color:#3dffb0;text-shadow:0 0 12px #3dffb088}
#form{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(620px,calc(100vw - 20px));background:#07110ef2;border-top:3px solid #3dffb0;border-radius:6px;padding:11px 12px;pointer-events:auto;text-align:center}
#form small{display:block;color:#ffd36b;font-weight:800;margin-bottom:6px;font-size:18px}
#eq{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px;font:800 clamp(20px,3.6vw,28px) "Exo 2",sans-serif;min-height:58px}
.fr{display:inline-flex;flex-direction:column;align-items:center}.fr>span{display:flex;align-items:center;gap:5px;padding:3px 6px}.fr>span:first-child{border-bottom:3px solid #e9f6f2}
.slot{min-width:52px;height:42px;display:inline-grid;place-items:center;border:2px dashed #3dffb088;border-radius:6px;padding:0 7px;cursor:pointer;background:#0d1d18}.slot.on{border-style:solid;background:#123a2c;color:#3dffb0}.slot.bad{border-color:#ff6b5a;background:#3a1512}
#tiles{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:9px}
#tiles button{min-width:62px;height:48px;border:0;border-radius:6px;background:linear-gradient(#e7fff5,#a9e8d0);color:#06211a;font:800 22px "Exo 2",sans-serif;cursor:pointer}#tiles button:disabled{opacity:.22}
#controls{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:9px;pointer-events:auto;width:min(640px,calc(100vw - 24px))}
#controls button{flex:1;height:66px;border:0;border-radius:6px;font:800 clamp(17px,2.9vw,23px) "Exo 2",sans-serif;color:#04120c;background:linear-gradient(#5dffc2,#1fcf8d);cursor:pointer}
#test{background:linear-gradient(#8fd0ff,#3d9cf2)!important}#again{background:#22303a!important;color:#e9f6f2!important;flex:.6!important}
#res{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:min(430px,92vw);background:#07110ef4;border-radius:8px;padding:14px 22px;text-align:center;border-top:4px solid #3dffb0;pointer-events:auto}
#res h2{margin:0 0 8px;font:900 clamp(24px,5vw,36px) Orbitron,sans-serif}
#g{position:relative;height:18px;border-radius:9px;background:linear-gradient(90deg,#7fd2ff,#2fbf71 42%,#2fbf71 58%,#ffb02e);margin:6px 0 12px}#n{position:absolute;top:-6px;left:50%;width:5px;height:30px;background:#fff;border-radius:3px;box-shadow:0 0 8px #fff;transition:left .9s cubic-bezier(.2,.9,.3,1.2)}
#res button{margin-top:10px;border:0;border-radius:6px;padding:11px 26px;font:800 21px "Exo 2",sans-serif;background:#3dffb0;color:#04120c;cursor:pointer}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:#04070acc;padding:16px;z-index:5}
#box{background:#07110ef2;border-top:4px solid #3dffb0;border-radius:8px;padding:22px 30px;text-align:center;max-width:560px}
#box h1{margin:0 0 8px;font:900 clamp(30px,6.4vw,48px) Orbitron,sans-serif;color:#3dffb0}#box p{margin:6px 0;font-size:20px}
#act{margin-top:12px;border:0;border-radius:6px;padding:12px 40px;font:800 25px "Exo 2",sans-serif;background:linear-gradient(#5dffc2,#1fcf8d);color:#04120c;cursor:pointer}#act:disabled{background:#2a3a35;color:#7d918a}
#step{margin-top:9px;padding-top:8px;border-top:1px solid #3dffb044;color:#ffd36b;font-size:18px}#step em{display:block;font:800 22px "Exo 2",sans-serif;font-style:normal;color:#fff;margin-bottom:4px}#step b{color:#3dffb0}.slot.next{border-color:#ffd36b;box-shadow:0 0 10px #ffd36b88}
[hidden]{display:none!important}
</style></head><body>
<div id="hud">
<div id="task"><small><span id="num"></span><span id="pts"></span></small><div id="txt"></div><div id="step" hidden></div></div>
<div id="scale"><small>ВЕСЫ, г</small><b id="mass">0</b></div>
<div id="form" hidden><small id="tip"></small><div id="eq"></div><div id="tiles"></div></div>
<div id="controls" hidden><button id="pour" type="button"></button><button id="test" type="button">Анализ</button><button id="again" type="button">Заново</button></div>
<div id="res" hidden><h2 id="rt"></h2><div id="g"><div id="n"></div></div><div id="rd"></div><button id="rb" type="button"></button></div>
</div>
<div id="ov"><div id="box"><h1>ЛАБОРАТОРИЯ</h1><p>1. Собери уравнение из чисел.</p><p>2. Реши его и держи кнопку, пока весы не покажут нужное.</p><p>3. Нажми «Анализ».</p><button id="act" type="button" disabled>Загрузка…</button></div></div>
<script type="module" src="game.js?v=6"></script>
</body></html>
