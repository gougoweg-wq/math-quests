<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Лаборатория</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Exo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#05080c;color:#e9f6f2;font:600 20px/1.25 "Exo 2",system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;inset:0;pointer-events:none}
#task{position:absolute;top:12px;left:12px;width:min(390px,calc(100vw - 24px));background:#08130fd9;border-left:4px solid #3dffb0;border-radius:6px;padding:12px 16px}
#task small{display:block;color:#7fd8b8;letter-spacing:1px;font-weight:800;margin-bottom:4px}#task b{color:#3dffb0}
#hint{margin-top:8px;color:#ffd36b;font-size:18px}
#scale{position:absolute;top:12px;right:12px;background:#02140ee6;border:1px solid #3dffb066;border-radius:6px;padding:8px 16px;text-align:right}
#scale small{display:block;font-size:14px;color:#7fd8b8}#scale b{font:900 clamp(30px,6vw,46px) Orbitron,sans-serif;color:#3dffb0;text-shadow:0 0 12px #3dffb088}
#controls{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto;width:min(620px,calc(100vw - 24px))}
#controls button{flex:1;height:68px;border:0;border-radius:6px;font:800 clamp(18px,3vw,24px) "Exo 2",sans-serif;color:#04120c;background:linear-gradient(#5dffc2,#1fcf8d);cursor:pointer}
#salt{background:linear-gradient(#ffe29a,#f2b63a)!important}
#test{background:linear-gradient(#8fd0ff,#3d9cf2)!important}#again{background:#22303a!important;color:#e9f6f2!important;flex:.7!important}
#controls button:disabled{opacity:.3}
#res{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:#08130ff2;border-radius:8px;padding:16px 26px;text-align:center;border-top:4px solid #3dffb0;pointer-events:auto;max-width:92vw}
#res h2{margin:0 0 6px;font:900 clamp(24px,5vw,38px) Orbitron,sans-serif}#res button{margin-top:10px;border:0;border-radius:6px;padding:11px 30px;font:800 22px "Exo 2",sans-serif;background:#3dffb0;color:#04120c;cursor:pointer}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:#05080ccc;padding:16px;z-index:5}
#box{background:#08130ff2;border-top:4px solid #3dffb0;border-radius:8px;padding:22px 30px;text-align:center;max-width:540px}
#box h1{margin:0 0 8px;font:900 clamp(32px,7vw,50px) Orbitron,sans-serif;color:#3dffb0}#box p{margin:6px 0;font-size:21px}
#act{margin-top:12px;border:0;border-radius:6px;padding:12px 40px;font:800 26px "Exo 2",sans-serif;background:linear-gradient(#5dffc2,#1fcf8d);color:#04120c;cursor:pointer}#act:disabled{background:#2a3a35;color:#7d918a}
[hidden]{display:none!important}
</style></head><body>
<div id="hud">
<div id="task"><small id="num"></small><div id="txt"></div><div id="hint" hidden></div></div>
<div id="scale"><small>ВЕСЫ, г</small><b id="mass">0</b></div>
<div id="res" hidden><h2 id="rt"></h2><div id="rd"></div><button id="rb" type="button"></button></div>
<div id="controls"><button id="pour" type="button">Держи: ВОДА</button><button id="salt" type="button" hidden>Держи: СОЛЬ</button><button id="test" type="button">Проверить</button><button id="again" type="button">Заново</button></div>
</div>
<div id="ov"><div id="box"><h1>ЛАБОРАТОРИЯ</h1><p>Сначала посчитай, сколько нужно долить.</p><p>Потом держи кнопку и смотри на весы. Обратно вылить нельзя.</p><button id="act" type="button" disabled>Загрузка…</button></div></div>
<script type="module" src="game.js?v=1"></script>
</body></html>
