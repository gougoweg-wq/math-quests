<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Весы</title><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#f3ede2;color:#2b2a28;font:700 20px "Exo 2",system-ui,sans-serif;user-select:none;touch-action:none}
svg{position:fixed;inset:0;width:100%;height:100%}#eq{position:fixed;top:12px;left:50%;transform:translateX(-50%);font-size:clamp(32px,6vw,52px);background:#fffc;padding:6px 26px;border-radius:8px}
#say{position:fixed;bottom:74px;left:50%;transform:translateX(-50%);font-size:clamp(18px,3vw,24px);white-space:nowrap}#bar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:9px}
button{font:800 21px "Exo 2";border:0;border-radius:6px;background:#2f6f62;color:#fff;height:52px;padding:0 22px;cursor:pointer}#re{background:#8a8378}</style></head><body><svg id="s" viewBox="0 0 1000 620"></svg><div id="eq"></div><div id="say"></div><div id="bar"><button id="ans">Проверить x</button><button id="re">Заново</button><button id="nx" hidden>Дальше</button></div>
<script>
const R=[[3,5,0,20,5],[2,6,1,10,4],[5,1,2,13,4],[4,2,2,12,5],[6,1,4,9,4]];window.ROUNDS=R;let r=0,a,b,c,d,X;const s=document.getElementById('s'),$=i=>document.getElementById(i);
function eqs(){const t=(p,q)=>[p?(p==1?'x':p+'x'):'',q?q:''].filter(Boolean).join(' + ')||'0';return t(a,b)+' = '+t(c,d)}
function load(){[a,b,c,d,X]=R[r];$('nx').hidden=true;$('ans').hidden=false;$('say').textContent='Убирай одинаковое с обеих чаш, чтобы весы не наклонились.';draw()}
function pan(cx,y,p,q,side){let h='',col=0,row=0;const place=(w,ht)=>{const px=cx-105+col*44,py=y-ht-row*46;col++;if(col>5){col=0;row++}return[px,py]};
for(let i=0;i<p;i++){const[x,yy]=place();h+='<g onclick="rm(\''+side+'\',\'x\')" style="cursor:pointer"><rect x="'+x+'" y="'+(y-42-row*46+ (col==0?46:0))+'" width="40" height="40" rx="6" fill="url(#gx)" stroke="#6d3b12"/><text x="'+(x+20)+'" y="'+(y-14-row*46+(col==0?46:0))+'" text-anchor="middle" fill="#fff" font-size="24">x</text></g>'}
for(let i=0;i<q;i++){const[x]=place();h+='<g onclick="rm(\''+side+'\',\'u\')" style="cursor:pointer"><circle cx="'+(x+20)+'" cy="'+(y-20-row*46+(col==0?46:0))+'" r="18" fill="url(#gu)" stroke="#3b4a57"/><text x="'+(x+20)+'" y="'+(y-13-row*46+(col==0?46:0))+'" text-anchor="middle" fill="#fff" font-size="19">1</text></g>'}return h}
function draw(){const L=a*X+b,Rr=c*X+d,t=Math.max(-12,Math.min(12,(Rr-L)*1.5)),ra=t*Math.PI/180,dx=270*Math.cos(ra),dy=270*Math.sin(ra),cx=500,cy=190,lx=cx-dx,ly=cy-dy,rx=cx+dx,ry=cy+dy,py=150+0;
s.innerHTML='<defs><linearGradient id="gx" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c47a35"/><stop offset="1" stop-color="#8c4f1b"/></linearGradient><radialGradient id="gu" cx=".35" cy=".3"><stop offset="0" stop-color="#9fb4c4"/><stop offset="1" stop-color="#4c6070"/></radialGradient><linearGradient id="br" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8a6a2c"/><stop offset=".5" stop-color="#e6c877"/><stop offset="1" stop-color="#8a6a2c"/></linearGradient></defs><rect x="485" y="190" width="30" height="330" fill="url(#br)"/><ellipse cx="500" cy="530" rx="120" ry="18" fill="url(#br)"/><line x1="'+lx+'" y1="'+ly+'" x2="'+rx+'" y2="'+ry+'" stroke="url(#br)" stroke-width="14" stroke-linecap="round"/><circle cx="500" cy="190" r="18" fill="#e6c877"/>'+[[lx,ly],[rx,ry]].map(([x,y])=>'<path d="M'+x+' '+y+' L'+(x-140)+' '+(y+py)+' M'+x+' '+y+' L'+(x+140)+' '+(y+py)+'" stroke="#8a6a2c" stroke-width="3"/><path d="M'+(x-150)+' '+(y+py)+' Q'+x+' '+(y+py+60)+' '+(x+150)+' '+(y+py)+' Z" fill="url(#br)"/>').join('')+pan(lx,ly+py,a,b,'L')+pan(rx,ry+py,c,d,'R');$('eq').textContent=eqs()}
window.rm=(sd,t)=>{if(sd=='L'){if(t=='x'&&a)a--;if(t=='u'&&b)b--}else{if(t=='x'&&c)c--;if(t=='u'&&d)d--}const L=a*X+b,Rr=c*X+d;$('say').textContent=L===Rr?'Весы ровно. Равенство сохранилось.':'Весы наклонились: сними то же самое с другой чаши.';draw()};
$('ans').onclick=()=>{const L=a*X+b,Rr=c*X+d;if(L!==Rr){$('say').textContent='Сначала выровняй весы.';return}if(a&&!b&&!c&&d){$('say').textContent=a+'x = '+d+', значит x = '+(d/a);$('ans').hidden=true;$('nx').hidden=false;$('nx').textContent=r<R.length-1?'Дальше':'Заново';return}$('say').textContent='Оставь иксы на одной чаше, а гирьки на другой.'};
$('nx').onclick=()=>{r=(r+1)%R.length;load()};$('re').onclick=load;load();
</script></body></html>
