<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Перекуп</title><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0b0d10;color:#f2f5f7;font:700 19px "Exo 2",system-ui,sans-serif;user-select:none}
#w{max-width:900px;margin:0 auto;padding:14px;display:flex;flex-direction:column;height:100%;gap:12px}#h{display:flex;justify-content:space-between;align-items:center;font-size:24px}#h b{color:#35e07a;font-size:32px}
#q{font-size:clamp(22px,3.6vw,30px)}#bars{display:grid;gap:5px;font-size:15px}.b{height:12px;background:#1b2026;border-radius:6px;overflow:hidden}.b i{display:block;height:100%;width:0}#you i{background:#35e07a}#bot i{background:#ff4b4b}
#l{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-height:0}.c{border:1px solid #2a323a;border-radius:8px;background:linear-gradient(160deg,#171c22,#101317);color:inherit;font:inherit;padding:14px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:8px;text-align:left}.c:hover{border-color:#35e07a}.c svg{width:100%;height:80px}.c small{color:#8e9aa6;font-size:15px}.c b{font-size:clamp(20px,3.4vw,30px)}.c.ok{border:3px solid #35e07a}.c.no{border:3px solid #ff4b4b;opacity:.6}
#m{min-height:30px;font-size:20px}#go{font:800 22px "Exo 2";border:0;border-radius:6px;padding:12px;background:#35e07a;color:#04120c;cursor:pointer}@media(max-width:560px){.c svg{display:none}}</style></head><body><div id="w"><div id="h"><span id="n"></span><span>Капитал: <b id="m0">1000 ₪</b></span></div><div id="q"></div><div id="bars"><div>Ты<div class="b" id="you"><i></i></div></div><div>Конкурент<div class="b" id="bot"><i></i></div></div></div><div id="l"></div><div id="m"></div><button id="go" hidden>Дальше</button></div>
<script>
// t:'d' скидка в %, 'u' рост в %, 'o' цена до скидки
const R=[['d',[[80,60],[200,170],[50,35]]],['u',[[80,100],[50,60],[200,230]]],['o',[[240,20],[180,10],[120,25]]],['d',[[120,90],[40,28],[300,240]]],['u',[[40,50],[60,66],[100,120]]],['o',[[150,25],[90,10],[120,20]]],['d',[[250,200],[60,48],[90,63]]],['o',[[270,10],[210,30],[320,20]]]];window.ROUNDS=R;
const val=(t,x)=>t=='d'?(x[0]-x[1])/x[0]*100:t=='u'?(x[1]-x[0])/x[0]*100:x[0]/(1-x[1]/100);window.val=val;
const Q={d:'Где самая большая скидка в процентах? Бери лот!',u:'Какая цена выросла сильнее всего в процентах?',o:'Какой лот был самым дорогим до скидки?'};const sh='<svg viewBox="0 0 200 80"><path d="M12 56 L14 26 Q30 34 46 22 L78 44 Q120 50 168 54 Q186 58 186 68 L12 68 Z" fill="url(#a)"/><path d="M12 68 H186 V74 H12 Z" fill="#eef2f4"/><defs><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="COL"/><stop offset="1" stop-color="#22282e"/></linearGradient></defs></svg>';const col=['#ff5a1f','#27a8ff','#35e07a'];
let r=0,m=1000,t0,tm,done,$=i=>document.getElementById(i),T=12000;
function lab(t,x){return t=='o'?'<small>цена сейчас, скидка '+x[1]+'%</small><b>'+x[0]+' ₪</b>':'<small>было '+x[0]+' ₪</small><b>стало '+x[1]+' ₪</b>'}
function start(){done=0;const[t,L]=R[r];$('n').textContent='Лот '+(r+1)+' из '+R.length;$('q').textContent=Q[t];$('m').textContent='';$('go').hidden=true;$('l').innerHTML=L.map((x,i)=>'<button class="c" onclick="pick('+i+')">'+sh.replace('COL',col[i]).replace(/id="a"/,'id="a'+i+'"').replace('url(#a)','url(#a'+i+')')+lab(t,x)+'</button>').join('');t0=performance.now();tick()}
function tick(){if(done)return;const e=(performance.now()-t0)/T;document.querySelector('#bot i').style.width=Math.min(e,1)*100+'%';if(e>=1){end(-1)}else requestAnimationFrame(tick)}
function end(i){done=1;const[t,L]=R[r],v=L.map(x=>val(t,x)),b=v.indexOf(Math.max(...v));[...document.querySelectorAll('.c')].forEach((c,k)=>{c.disabled=true;if(k==b)c.classList.add('ok');else if(k==i)c.classList.add('no')});const s=t=='o'?v.map(x=>Math.round(x)+' ₪').join(', '):v.map(x=>Math.round(x)+'%').join(', ');let g;if(i==b){g=100+Math.round((1-(performance.now()-t0)/T)*100);m+=g;$('m').textContent='Твой лот! +'+g+' ₪. Ответы: '+s}else{g=-100;m+=g;$('m').textContent=(i<0?'Конкурент успел! ':'Мимо. ')+'−100 ₪. Ответы: '+s}$('m0').textContent=m+' ₪';document.querySelector('#you i').style.width=(r+1)/R.length*100+'%';$('go').hidden=false;$('go').textContent=r<R.length-1?'Следующий лот':'Итог'}
window.pick=i=>{if(!done)end(i)};$('go').onclick=()=>{r++;if(r<R.length)start();else{let b=0;try{b=+localStorage.flipBest||0;if(m>b)localStorage.flipBest=m}catch(e){}$('q').textContent='Итог: '+m+' ₪'+(m>b?', новый рекорд!':', рекорд '+b+' ₪');$('l').innerHTML='';$('m').textContent='';$('bars').hidden=true;$('go').textContent='Сыграть ещё';$('go').onclick=()=>location.reload()}};start();
</script></body></html>
