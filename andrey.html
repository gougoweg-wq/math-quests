<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Взлом сейфа</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@700;800;900&display=swap">
<style>:root{--bg:#0b0f0c;--fg:#e8ffe9;--muted:#8fb79a;--panel:#111a14;--line:#1f3a27;--accent:#35f07a;--accent2:#ffd24a;--on:#04210f;--stage:radial-gradient(ellipse at center,#16241a,#070b08);--screen:#020503;--key:#15231a;--keysh:#050a06;--ok:#35f07a;--bad:#ff5c5c;--hintbg:#18301f;--f:"Inter",system-ui,sans-serif;--fd:"Share Tech Mono",monospace;--fm:"Share Tech Mono",monospace;color-scheme:dark}
.safe{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;border-radius:18px;background:linear-gradient(145deg,#4a5a50,#232b26);border:4px solid #0a0f0b;box-shadow:0 14px 30px rgba(0,0,0,.6)}
.dial{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:radial-gradient(#9aa69e,#4c5650);border:5px solid #1b221d;transition:transform .5s}
.dial::after{content:"";position:absolute;left:50%;top:6px;width:4px;height:18px;margin-left:-2px;background:#35f07a;border-radius:2px}
.leds{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px}.leds i{width:12px;height:12px;border-radius:50%;background:#2b3a30}.leds i.on{background:#35f07a;box-shadow:0 0 8px #35f07a}
.safe.locked{animation:sh .4s;border-color:#ff5c5c}.safe.open .dial{transform:rotate(720deg)}
.lockmsg{position:absolute;left:0;right:0;top:10px;text-align:center;font:900 14px "Share Tech Mono";color:#ff5c5c;letter-spacing:.1em}</style>
<link rel="stylesheet" href="base.css"></head><body>
<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
window.QUEST={title:'Взлом сейфа',icon:'🔐',coin:'💰',intro:'Каждый верный ответ — цифра кода. Ошибка блокирует сейф на 3 секунды, так что не спеши. Бонус — за серию без ошибок, а не за скорость.',playLabel:'Взломать',
particles:['#35f07a','#ffd24a','#ffffff'],praise:['Цифра подобрана.','Щёлк!','Верно.','Чисто.'],streakBonus:'🔥 Серия без ошибок, ×2!',lockMs:3000,lockMsg:'Сейф заблокирован. Проверь ответ ещё раз…',wrongMsg:'Неверно. Сейф заблокирован на 3 секунды — пересчитай.',winIcon:'💰',winTitle:'Сейф открыт!',negative:false,goLabel:'Ввести код',
levels:[
 {name:'Быстрое умножение',n:6,gen(){return pick([()=>{const a=R(12,48)*2;return {q:a+' · 5',a:a*5,hint:'·5 = ·10 и пополам: '+a*10+' : 2',kind:'Быстрое умножение'}},()=>{const a=R(12,81);return (a%10+Math.floor(a/10))<10?{q:a+' · 11',a:a*11,hint:'Раздвинь цифры и вставь их сумму',kind:'Быстрое умножение'}:null},()=>{const a=R(3,9);return {q:'99 · '+a,a:99*a,hint:'100 · '+a+' − '+a,kind:'Быстрое умножение'}},()=>{const a=pick([25,125]),b=a===25?R(2,9)*4:8;return {q:a+' · '+b,a:a*b,hint:a===25?'25 · 4 = 100':'125 · 8 = 1000',kind:'Быстрое умножение'}}])()||this.gen()}},
 {name:'Ловушки',n:5,gen(){return pick([()=>{const v=R(5,20),d=R(2,7);return {q:'У Пети '+(v+d)+' яблок, это на '+d+' больше, чем у Васи. Сколько у Васи?',a:v,hint:'«На '+d+' больше, чем у Васи» — значит у Васи меньше',kind:'Задачи-ловушки'}},()=>{const n=R(3,9);return {q:'Бревно распилили на '+n+' частей. Сколько было распилов?',a:n-1,hint:'Нарисуй: 2 части — 1 распил',kind:'Задачи-ловушки'}},()=>{const s=R(3,8);return {q:'Лестница: между этажами '+s+' ступенек. Сколько ступенек с 1-го до 4-го этажа?',a:3*s,hint:'С 1-го до 4-го — 3 пролёта',kind:'Задачи-ловушки'}}])()}},
 {name:'Уравнения',n:7,gen(){return pick([()=>{const x=R(5,60),b=R(5,40);return {q:'x + '+b+' = '+(x+b),a:x,hint:'Убери '+b+' с обеих сторон',kind:'Уравнения'}},()=>{const x=R(3,25),a=R(2,9);return {q:a+'x = '+a*x,a:x,hint:'Раздели обе части на '+a,kind:'Уравнения'}},()=>{const x=R(2,15),a=R(2,6),b=R(1,20);return {q:a+'x + '+b+' = '+(a*x+b),a:x,hint:'Сначала убери '+b+', потом раздели на '+a,kind:'Уравнения'}},()=>{const x=R(2,12),a=R(2,6),b=R(1,15);return {q:a+'x − '+b+' = '+(a*x-b),a:x,hint:'Прибавь '+b+' к обеим частям',kind:'Уравнения'}}])()}},
 {name:'Сложные уравнения',n:5,gen(){return pick([()=>{const x=R(2,12),c=R(1,4),a=c+R(1,4),b=R(1,20);return {q:a+'x + '+b+' = '+c+'x + '+(b+(a-c)*x),a:x,hint:'Иксы влево, числа вправо',kind:'Уравнения с x с двух сторон'}},()=>{const x=R(4,20),a=R(2,5),b=R(2,15);return {q:'Задумали число, умножили на '+a+' и прибавили '+b+'. Получилось '+(a*x+b)+'. Что за число?',a:x,hint:a+'x + '+b+' = '+(a*x+b),kind:'Задачи на уравнение'}}])()}}],
onLevel(st){st.innerHTML='<div class="lockmsg" id="lockmsg"></div><div class="safe" id="safe"><div class="dial" id="dial"></div><div class="leds" id="leds"></div></div>';this._r=0;this._n=0},
onCorrect(st,score,streak){const leds=document.getElementById('leds');const l=document.createElement('i');l.className='on';leds.append(l);if(leds.children>8)leds.firstChild.remove();this._r+=137;document.getElementById('dial').style.transform='rotate('+this._r+'deg)';document.getElementById('lockmsg').textContent=''},
onLock(st){const s=document.getElementById('safe');s.classList.remove('locked');void s.offsetWidth;s.classList.add('locked');const m=document.getElementById('lockmsg');m.textContent='LOCKED 3s';setTimeout(()=>m.textContent='',3000)}};
</script><script src="engine.js"></script></body></html>
