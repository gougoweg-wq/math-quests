<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Дуэль магов</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Exo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07051a;color:#f3e9d2;font:600 18px/1.3 "Exo 2",system-ui,sans-serif;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;display:block}
#hud{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;padding:12px 16px;pointer-events:none}
.box{background:#0d0a26cc;border:1px solid #d9b25a55;border-radius:8px;padding:7px 13px}
.box small{display:block;font-size:12px;letter-spacing:1px;color:#d9b25a}
#lives{font-size:24px;letter-spacing:3px}
#round{text-align:center;font:900 15px Cinzel,serif;color:#d9b25a}#round b{display:block;font:700 13px "Exo 2";color:#cfc3ff;letter-spacing:0}
#ehp{width:min(220px,34vw);height:12px;border-radius:6px;background:#2a1530;overflow:hidden;margin-top:4px}#ehp i{display:block;height:100%;background:linear-gradient(90deg,#39d98a,#9dffb0);transition:width .6s}
#panel{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(760px,calc(100vw - 16px));background:linear-gradient(#140f33f2,#0b0822f7);border:1px solid #d9b25a66;border-radius:12px;padding:10px 12px 12px;text-align:center}
#task{font-size:18px;min-height:24px;color:#f3e9d2}#task b{color:#ffd76a}
#bar{position:relative;height:30px;margin:9px 2px 4px;border-radius:6px;background:#221a4a;display:flex;overflow:visible}
#bar .s{flex:1;border-right:1px solid #0b082277;transition:background .25s}
#bar .s.a{background:linear-gradient(#7fb2ff,#3d6fe0)}#bar .s.b{background:linear-gradient(#ffe08a,#e0a530)}#bar .s.c{background:linear-gradient(#b7a6ff,#7a5cf0)}
#mark{position:absolute;top:-7px;bottom:-7px;width:4px;margin-left:-2px;background:#ff5d8f;box-shadow:0 0 10px #ff5d8f;border-radius:2px;transition:left .3s}
#mark span{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;color:#ff9dbb;white-space:nowrap}
#eq{min-height:24px;font-size:17px;color:#cfc3ff}#eq b{color:#fff}
#cards{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin-top:8px}
.card{width:86px;height:112px;border:0;border-radius:9px;cursor:pointer;background:radial-gradient(circle at 50% 30%,#fff6dc,#e8d3a0 70%,#c9a868);color:#2b1a08;box-shadow:0 4px 0 #8a6a2e,0 0 0 2px #6b4f1f inset;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s;font-family:Cinzel,serif;position:relative}
.card .g{font-size:16px;color:#8a5a1a;opacity:.75;margin-bottom:2px}
.fr{display:inline-flex;flex-direction:column;align-items:center;font:900 26px Cinzel,serif;line-height:1}.fr i{font-style:normal;padding:0 6px}.fr i:first-child{border-bottom:3px solid currentColor;padding-bottom:2px;margin-bottom:2px}
.card.sel{transform:translateY(-10px);box-shadow:0 4px 0 #8a6a2e,0 0 0 3px #ffd76a inset,0 0 22px #ffd76a}
.card.sel.s1{box-shadow:0 4px 0 #8a6a2e,0 0 0 3px #5b8cff inset,0 0 22px #5b8cff}
.card:disabled{opacity:.35;cursor:default}
#btns{display:flex;gap:9px;justify-content:center;margin-top:10px}
#btns button{height:48px;padding:0 22px;border:0;border-radius:8px;font:800 19px "Exo 2";cursor:pointer}
#cast{background:linear-gradient(#ffe08a,#e0a530);color:#2b1a08;min-width:190px}#cast:disabled{background:#3a3260;color:#8f86b8;cursor:default}
#hint{background:#2a2156;color:#cfc3ff}
#next{background:linear-gradient(#8affc1,#2fcf8a);color:#06261a}
#ov{position:fixed;inset:0;display:grid;place-items:center;background:#07051acc;padding:16px;z-index:5}
#ovb{max-width:560px;background:linear-gradient(#17113ef5,#0b0822f7);border:1px solid #d9b25a88;border-radius:14px;padding:24px 28px;text-align:center}
#ovb h1{margin:0 0 10px;font:900 clamp(30px,7vw,46px) Cinzel,serif;color:#ffd76a;text-shadow:0 0 18px #ffb84a88}
#ovb p{margin:7px 0;font-size:19px}
#ovb button{margin-top:14px;height:54px;padding:0 36px;border:0;border-radius:9px;font:800 22px "Exo 2";background:linear-gradient(#ffe08a,#e0a530);color:#2b1a08;cursor:pointer}
[hidden]{display:none!important}
@media (max-height:640px){.card{height:92px;width:74px}.fr{font-size:22px}#panel{padding:7px 9px 9px}}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="box"><small>ТВОИ ЖИЗНИ</small><div id="lives"></div></div>
  <div class="box" id="round"></div>
  <div class="box" style="text-align:right"><small>ТЁМНЫЙ МАГ</small><div id="ehp"><i></i></div></div>
</div>
<div id="panel" hidden>
  <div id="task"></div>
  <div id="bar"><div id="mark"><span></span></div></div>
  <div id="eq"></div>
  <div id="cards"></div>
  <div id="btns"><button id="hint" type="button">Люмос (подсказка)</button><button id="cast" type="button" disabled>Колдовать</button><button id="next" type="button" hidden>Следующий щит</button></div>
</div>
<div id="ov"><div id="ovb"><h1>ДУЭЛЬ МАГОВ</h1>
<p>Тёмный маг закрылся щитом. Сила щита — дробь.</p>
<p>Собери из рун заклинание <b>ровно</b> такой же силы.</p>
<p>Больше — заклинание отразится в тебя. Меньше — щит устоит.</p>
<button id="start" type="button">Начать дуэль</button></div></div>
<script src="game.js?v=1"></script>
</body></html>
